</style>
</head>
<body>
<div class="wallpaper" id="wallpaper" aria-hidden="true">
  <div class="wall-img" id="wallImg"></div>
  <div class="wall-scrim" id="wallScrim"></div>
</div>
<div class="app">
  <header class="topbar" id="topbar">
    <div class="top-grid">
      <div class="top-left">
        <button class="mark-btn" id="aboutBtn" type="button" data-action="about" aria-label="关于工时记">工</button>
      </div>
      <div class="brand">
        <h1>工时记</h1>
        <button class="bg-btn" id="bgBtn" type="button" data-action="open-bg" aria-label="自定义背景" title="自定义背景">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1.1.9-2 2-2h1.5A4.5 4.5 0 0 0 21 10c0-3.9-4-7-9-7Z"/><circle cx="7.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="7.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <div class="top-right">
        <button class="cycle-btn" id="cycleBtn" type="button" data-action="cycle">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
          <span id="cycleText">自然月</span>
        </button>
      </div>
    </div>
    <div class="worker-bar">
      <div class="worker-switch" id="workerSwitch" role="tablist" aria-label="工种切换">
        <button type="button" role="tab" data-action="set-worker" data-w="regular" class="on" aria-selected="true">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5V3h6v1.5M8 12h8M8 16h5"/></svg>
          正式工
        </button>
        <button type="button" role="tab" data-action="set-worker" data-w="temp" aria-selected="false">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          临时工
        </button>
        <button type="button" role="tab" data-action="set-worker" data-w="piece" aria-selected="false">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.2 12 4l8.5 4.2v7.6L12 20l-8.5-4.2z"/><path d="M3.5 8.2 12 12.4l8.5-4.2M12 12.4V20"/></svg>
          计件
        </button>
        <button type="button" role="tab" data-action="set-worker" data-w="site" aria-selected="false">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.5v-3a8 8 0 0 1 16 0v3"/><path d="M2.5 18.5h19M9 7.2V4.4c0-.6.4-1 1-1h4c.6 0 1 .4 1 1v2.8"/></svg>
          工地
        </button>
      </div>
    </div>
  </header>
  <div class="warning" id="storageWarning" role="status" hidden></div>
  <main id="main" role="main"></main>
</div>

<nav class="nav" aria-label="应用导航">
  <button type="button" data-nav="calendar" data-action="view" data-view="calendar" class="on" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/><circle cx="8" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="17.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/></svg>
    日历
  </button>
  <button type="button" data-nav="details" data-action="view" data-view="details" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16M4 12h16M4 18.5h10"/><circle cx="19" cy="18.5" r="1.4" fill="currentColor" stroke="none"/></svg>
    明细
  </button>
  <button type="button" data-nav="settings" data-action="view" data-view="settings" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    设置
  </button>
</nav>

<dialog id="editor" class="sheet" aria-label="记工"></dialog>
<dialog id="cycleDialog" class="sheet" aria-label="工资周期"></dialog>
<dialog id="aboutDialog" class="sheet" aria-label="关于工时记"></dialog>
<dialog id="bgDialog" class="sheet" aria-label="自定义背景"></dialog>
<dialog id="payslipDialog" class="sheet" aria-label="工资条"></dialog>
<dialog id="timerDialog" class="sheet" aria-label="计时器"></dialog>
<dialog id="confirmDialog" class="confirm" aria-labelledby="confirmTitle">
  <h2 id="confirmTitle">确认</h2>
  <p id="confirmText"></p>
  <div class="c-btns">
    <button class="btn btn-ghost" type="button" data-action="cancel-confirm">取消</button>
    <button class="btn btn-primary" id="confirmYes" type="button">确定</button>
  </div>
</dialog>

<div class="keypad" id="keypad" aria-hidden="true">
  <div class="kp-head">
    <div class="kp-modes" id="kpModes">
      <button type="button" data-mode="num">123</button>
      <button type="button" data-mode="en">ABC</button>
      <button type="button" data-mode="py26" class="on">拼音</button>
      <button type="button" data-mode="py9">九键</button>
    </div>
    <button type="button" class="kp-sys" data-k="sys">系统键盘</button>
    <button type="button" class="kp-hide" data-k="hide" aria-label="向下收起">⌄</button>
  </div>
  <div class="kp-info">
    <span class="kp-label" id="kpLabel">输入</span>
    <span class="kp-py" id="kpPy"></span>
    <span class="kp-val" id="kpVal">0</span>
    <span class="kp-unit" id="kpUnit"></span>
  </div>
  <div class="kp-cbar">
    <button type="button" class="kp-page" id="kpPrev" data-k="prevpage" aria-label="上一页候选" hidden>‹</button>
    <div class="kp-cands" id="kpCands" hidden></div>
    <button type="button" class="kp-page" id="kpNext" data-k="nextpage" aria-label="下一页候选" hidden>›</button>
  </div>

  <div class="kp-grid" id="kpGrid">
    <button class="key" type="button" data-key="1">1</button>
    <button class="key" type="button" data-key="2">2</button>
    <button class="key" type="button" data-key="3">3</button>
    <button class="key fn key-del" type="button" data-key="del" data-k="del" aria-label="退格"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5h11A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-11L3 12l5.5-7Z"/><path d="m10 9.5 5 5M15 9.5l-5 5"/></svg></button>
    <button class="key" type="button" data-key="4">4</button>
    <button class="key" type="button" data-key="5">5</button>
    <button class="key" type="button" data-key="6">6</button>
    <button class="key fn" type="button" data-key="clear">清空</button>
    <button class="key" type="button" data-key="7">7</button>
    <button class="key" type="button" data-key="8">8</button>
    <button class="key" type="button" data-key="9">9</button>
    <button class="key done" type="button" data-key="done">完成</button>
    <button class="key" type="button" data-key=".">.</button>
    <button class="key zero" type="button" data-key="0">0</button>
    <button class="key fn" type="button" data-key="00">00</button>
  </div>

  <div class="kp-alpha" id="kpAlpha" hidden>
    <div class="alpha-row">
      <button class="akey" type="button" data-k="q">q</button><button class="akey" type="button" data-k="w">w</button><button class="akey" type="button" data-k="e">e</button><button class="akey" type="button" data-k="r">r</button><button class="akey" type="button" data-k="t">t</button><button class="akey" type="button" data-k="y">y</button><button class="akey" type="button" data-k="u">u</button><button class="akey" type="button" data-k="i">i</button><button class="akey" type="button" data-k="o">o</button><button class="akey" type="button" data-k="p">p</button>
    </div>
    <div class="alpha-row alpha-row-2">
      <button class="akey" type="button" data-k="a">a</button><button class="akey" type="button" data-k="s">s</button><button class="akey" type="button" data-k="d">d</button><button class="akey" type="button" data-k="f">f</button><button class="akey" type="button" data-k="g">g</button><button class="akey" type="button" data-k="h">h</button><button class="akey" type="button" data-k="j">j</button><button class="akey" type="button" data-k="k">k</button><button class="akey" type="button" data-k="l">l</button>
    </div>
    <div class="alpha-row">
      <button class="akey akey-fn akey-shift" type="button" data-k="shift" id="kpShift" aria-label="大小写">⇧</button>
      <button class="akey" type="button" data-k="z">z</button><button class="akey" type="button" data-k="x">x</button><button class="akey" type="button" data-k="c">c</button><button class="akey" type="button" data-k="v">v</button><button class="akey" type="button" data-k="b">b</button><button class="akey" type="button" data-k="n">n</button><button class="akey" type="button" data-k="m">m</button>
      <button class="akey akey-fn" type="button" data-k="del" aria-label="退格"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5h11A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-11L3 12l5.5-7Z"/><path d="m10 9.5 5 5M15 9.5l-5 5"/></svg></button>
    </div>
  </div>

  <div class="kp-t9" id="kpT9" hidden>
    <button class="tkey" type="button" data-k="t1"><b>1</b><small>，</small></button>
    <button class="tkey" type="button" data-k="t2"><b>2</b><small>abc</small></button>
    <button class="tkey" type="button" data-k="t3"><b>3</b><small>def</small></button>
    <button class="tkey" type="button" data-k="t4"><b>4</b><small>ghi</small></button>
    <button class="tkey" type="button" data-k="t5"><b>5</b><small>jkl</small></button>
    <button class="tkey" type="button" data-k="t6"><b>6</b><small>mno</small></button>
    <button class="tkey" type="button" data-k="t7"><b>7</b><small>pqrs</small></button>
    <button class="tkey" type="button" data-k="t8"><b>8</b><small>tuv</small></button>
    <button class="tkey" type="button" data-k="t9"><b>9</b><small>wxyz</small></button>
    <button class="tkey fn" type="button" data-k="comma">，</button>
    <button class="tkey" type="button" data-k="t0"><b>0</b><small>空</small></button>
    <button class="tkey fn" type="button" data-k="del" aria-label="退格">⌫</button>
  </div>

  <div class="kp-foot" id="kpFoot">
    <button class="fkey wide" type="button" data-k="space">空格</button>
    <button class="fkey" type="button" data-k="period">。</button>
    <button class="fkey" type="button" data-k="comma">，</button>
    <button class="fkey go" type="button" data-k="done">完成</button>
  </div>
  <div class="kp-bubble" id="kpBubble" aria-hidden="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="bgFile" accept="image/*" hidden>
<div class="print-area" id="printArea"></div>
<script>
