/* 调休上班日（周末补班）——只收录已公布年份 */
const MAKEUP_WORKDAYS = new Set([
  '2025-01-26', '2025-02-08', '2025-04-27', '2025-09-28', '2025-10-11',
  '2026-01-04', '2026-02-14', '2026-02-28', '2026-05-09', '2026-09-20', '2026-10-10'
]);

let holidayMap = null;

function buildHolidayMap() {
  const map = {};
  const addRange = (a, b, name) => {
    let cur = parseD(a);
    const end = parseD(b);
    let guard = 0;
    while (cur <= end && guard++ < 60) {
      map[ymd(cur)] = name;
      cur.setDate(cur.getDate() + 1);
    }
  };
  HOLIDAY_FIXED.forEach(r => addRange(r[0], r[1], r[2]));
  return map;
}

function ensureHolidays() {
  if (!holidayMap) holidayMap = buildHolidayMap();
  return holidayMap;
}

/** 节假日名称；'' 表示不是节假日 */
function holidayName(k) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return '';
  const m = ensureHolidays();
  return m[k] || '';
}

const HOLIDAY_MIN = '2025-01-01';
const HOLIDAY_MAX = '2030-12-31';

/* ---------- 工作日 / 日期类型（每个工种独立） ---------- */
const DEFAULT_WORKWEEK = [0, 1, 1, 1, 1, 1, 0];

function workWeekOf(kind) {
  const s = state.data[kind || state.active].settings;
  const wk = s && s.workWeek;
  return (Array.isArray(wk) && wk.length === 7) ? wk : DEFAULT_WORKWEEK;
}

/** 当前/指定工种视角是否休息日 */
function isOffDay(k, kind) {
  kind = kind || state.active;
  const s = state.data[kind].settings;
  const o = state.overrides[k];
  if (o === 'holiday') return true;
  if (o === 'workday') return false;
  if (s.followMakeup !== false && MAKEUP_WORKDAYS.has(k)) return false;
  if (s.followHoliday !== false && holidayName(k)) return true;
  const wk = workWeekOf(kind);
  return !wk[parseD(k).getDay()];
}

/** 日期类型：holiday | weekend | workday | off */
function dateType(k, kind) {
  kind = kind || state.active;
  if (state.overrides[k] === 'holiday') return 'holiday';
  if (state.overrides[k] === 'workday') return 'workday';
  if (holidayName(k)) return 'holiday';
  if (MAKEUP_WORKDAYS.has(k) && state.data.regular.settings.followMakeup !== false) return 'workday';
  if (isOffDay(k, kind)) {
    const dow = parseD(k).getDay();
    return (dow === 0 || dow === 6) ? 'weekend' : 'off';
  }
  return 'workday';
}

/** 加班倍数（正式工参数；其他工种没有倍数时按正式工的算） */
function multiplierFor(k, kind) {
  const s = state.data[kind || 'regular'].settings;
  const r = state.data.regular.settings;
  const mw = (s && s.mulWeekday !== undefined) ? s : r;
  const t = dateType(k, kind);
  return t === 'holiday' ? mw.mulHoliday : t === 'weekend' ? mw.mulWeekend : mw.mulWeekday;
}
/* =====================================================================
   算法层：工资周期 / 四工种各自的结算
   ===================================================================== */

/** 工资周期（全局一个周期设置） */
function cycleRange(y, m) {
  const sd = clamp(Math.round(state.cycleStartDay || 1), 1, 28);
  let start, end;
  if (sd === 1) {
    // 自然月：1 号到月底
    start = new Date(y, m, 1);
    end = new Date(y, m + 1, 0);
  } else {
    // 非自然月：本月 sd 号 ～ 下月 sd-1 号（例如 2号 - 下月1号）
    start = new Date(y, m, sd);
    end = new Date(y, m + 1, sd - 1);
  }
  const dates = [];
  const cursor = new Date(start);
  let guard = 0;
  while (cursor <= end && guard++ < 40) {
    dates.push(ymd(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }
  const natural = sd === 1;
  const label = natural
    ? `${y}年${m + 1}月`
    : `${start.getFullYear()}年${start.getMonth() + 1}月${start.getDate()}日 - ${end.getMonth() + 1}月${end.getDate()}日`;
  return { start, end, dates, natural, label, y, m, sd };
}

/** 某一天属于哪个月份的工资周期（返回 {y, m}） */
function cycleMonthOf(k) {
  const d = parseD(k);
  const sd = clamp(Math.round(state.cycleStartDay || 1), 1, 28);
  let y = d.getFullYear(), m = d.getMonth();
  if (sd > 1 && d.getDate() < sd) {
    const p = new Date(y, m - 1, 1);
    y = p.getFullYear(); m = p.getMonth();
  }
  return { y, m };
}

/** 周期内应出勤天数（按指定工种的工作周） */
function payDaysInCycle(cyc, kind) {
  kind = kind || state.active;
  let n = 0;
  for (const k of cyc.dates) if (!isOffDay(k, kind)) n++;
  return n;
}

/** 正式工小时工资（按周期算；自定义优先） */
function hourlyRateFor(kind, cyc) {
  const s = state.data[kind || 'regular'].settings;
  if (s.hourlyRate && s.hourlyRate > 0) return s.hourlyRate;
  if (s.autoDays) {
    const days = cyc ? payDaysInCycle(cyc, 'regular') : state.data.regular.settings.daysPerMonth;
    return days > 0 ? s.baseSalary / (days * s.hoursPerDay) : 0;
  }
  const div = s.daysPerMonth * s.hoursPerDay;
  return div > 0 ? s.baseSalary / div : 0;
}

/** 单日所属自然月的周期 */
function cycleOfDay(k) {
  const d = parseD(k);
  return cycleRange(d.getFullYear(), d.getMonth());
}

/** 单日时薪（按该日所在自然月） */
function hourlyRateOfDay(k) {
  return hourlyRateFor('regular', cycleOfDay(k));
}

/** 当前查看月份对应的周期（编辑器计算提示用） */
function currentCycle() {
  return cycleRange(month.getFullYear(), month.getMonth());
}

/* ---------------- 单日工资 ---------------- */
function fullDayHours() { return state.data.regular.settings.hoursPerDay; }

/** 加班倍率档位：wd=平时 / we=周末 / hd=节假日 */
const OT_KEYS = ['wd', 'we', 'hd'];
const OT_LABEL = { wd: '平时', we: '周末', hd: '节假日' };
const OT_MULKEY = { wd: 'mulWeekday', we: 'mulWeekend', hd: 'mulHoliday' };

/** 某档在正式工设置里的倍率 */
function otMul(key, s) {
  s = s || state.data.regular.settings;
  return num(s[OT_MULKEY[key]], 1, 0, 10);
}

/** 某天的法定档位（由日类型决定） */
function legalOtKey(k) {
  const t = dateType(k, 'regular');
  return t === 'holiday' ? 'hd' : t === 'weekend' ? 'we' : 'wd';
}

/** 把一条记录的加班拆成分段 [{key,h,mul}]；未拆分时整天按法定档 */
function otPartsOf(k, rec) {
  if (!rec) return [];
  const ot = num(rec.otHours, 0, 0, 24);
  if (ot <= 0) return [];
  const s = state.data.regular.settings;
  if (Array.isArray(rec.otSplit)) {
    const parts = [];
    OT_KEYS.forEach((key, i) => {
      const h = num(rec.otSplit[i], 0, 0, 24);
      if (h > 0) parts.push({ key, h, mul: otMul(key, s) });
    });
    return parts;
  }
  const key = legalOtKey(k);
  return [{ key, h: ot, mul: otMul(key, s) }];
}

/** 正式工当天的加班费（按实际拆分） */
function regularDayOtPay(k, rec) {
  if (!rec) return 0;
  const hr = hourlyRateOfDay(k);
  return round2(sum(otPartsOf(k, rec).map(p => p.h * p.mul)) * hr);
}

/** 如果全天按法定倍率应当拿多少 */
function regularDayOtLegalPay(k, rec) {
  if (!rec) return 0;
  const ot = num(rec.otHours, 0, 0, 24);
  if (ot <= 0) return 0;
  return round2(ot * otMul(legalOtKey(k)) * hourlyRateOfDay(k));
}

/** 倍率被对调后少拿的钱（正数=被少算） */
function regularDayOtLoss(k, rec) {
  return round2(regularDayOtLegalPay(k, rec) - regularDayOtPay(k, rec));
}

function regularShortHours(rec) {
  const full = fullDayHours();
  const rh = (rec.regularHours === null || rec.regularHours === undefined) ? full : rec.regularHours;
  return Math.max(0, full - rh);
}

/** 正式工当天除底薪外的增减（加班费 / 缺勤扣款 / 事假扣款） */
function regularDayWage(k, rec, cyc) {
  if (!rec) return 0;
  if (rec.shift === '休息' || rec.shift === '病假') return 0;
  const hr = hourlyRateFor('regular', cyc || cycleOfDay(k));
  if (rec.shift === '事假') {
    return isOffDay(k, 'regular') ? 0 : -round2(fullDayHours() * hr);
  }
  const short = regularShortHours(rec);
  return round2(regularDayOtPay(k, rec) - short * hr);
}

/** 临时工当天工资 */
function tempDayWage(rec) {
  if (!rec) return 0;
  return round2(num(rec.hours, 0, 0, 24) * num(rec.rate, 0, 0, 1e6));
}

/** 计件当天工资 */
function pieceDayWage(rec) {
  if (!rec || !Array.isArray(rec.items)) return 0;
  return round2(sum(rec.items.map(it => num(it.qty, 0, 0, 1e6) * num(it.rate, 0, 0, 1e6))));
}

function pieceDayQty(rec) {
  if (!rec || !Array.isArray(rec.items)) return 0;
  return round2(sum(rec.items.map(it => num(it.qty, 0, 0, 1e6))));
}

/** 工地当天「干活」收入（点工 + 小时 + 包工 + 加班）；借支/结算单独统计 */
function siteDayWage(rec) {
  if (!rec || rec.type !== 'work') return 0;
  let v = 0;
  if (rec.unit === 'day') v += num(rec.units, 0, 0, 30) * num(rec.dayRate, 0, 0, 1e6);
  else if (rec.unit === 'hour') v += num(rec.hours, 0, 0, 24) * num(rec.hourRate, 0, 0, 1e6);
  v += num(rec.pkgQty, 0, 0, 1e6) * num(rec.pkgRate, 0, 0, 1e6);
  v += num(rec.otHours, 0, 0, 24) * num(rec.otRate, 0, 0, 1e6);
  return round2(v);
}

/** 通用单日金额（用于日历与明细显示） */
function dayWage(k, rec, kind, cyc) {
  kind = kind || state.active;
  if (!rec) return 0;
  if (kind === 'regular') return regularDayWage(k, rec, cyc);
  if (kind === 'temp') return tempDayWage(rec);
  if (kind === 'piece') return pieceDayWage(rec);
  return siteDayWage(rec);
}

/** 单日描述（明细列表用） */
function dayDesc(rec, kind) {
  kind = kind || state.active;
  if (!rec) return '未记录';
  if (kind === 'regular') {
    if (!WORK_SHIFTS.includes(rec.shift)) return rec.shift;
    const short = regularShortHours(rec);
    let s = rec.shift + ' · 加班 ' + num(rec.otHours, 0, 0, 24) + ' 小时';
    if (Array.isArray(rec.otSplit)) {
      const txt = OT_KEYS.map((key, i) => rec.otSplit[i] > 0 ? OT_LABEL[key] + round2(rec.otSplit[i]) + 'h' : '').filter(Boolean).join(' + ');
      if (txt) s += '（' + txt + '）';
    }
    if (short > 0) s += ' · 正班缺 ' + short + ' 小时';
    return s;
  }
  if (kind === 'temp') return `${rec.shift} · ${num(rec.hours, 0, 0, 24)} 小时 × ${money(rec.rate)}`;
  if (kind === 'piece') {
    const n = rec.items ? rec.items.length : 0;
    const q = pieceDayQty(rec);
    if (!n) return '计件';
    if (n === 1) return `${rec.items[0].name || '计件'} ${rec.items[0].qty}${state.data.piece.settings.unit} × ${money(rec.items[0].rate)}`;
    return `${n} 项 · 共 ${q}${state.data.piece.settings.unit}`;
  }
  if (rec.type === 'borrow') return '借支 ' + money(rec.amount);
  if (rec.type === 'settle') return '结算 ' + money(rec.amount);
  let parts = [];
  if (rec.unit === 'day') parts.push(`${num(rec.units, 0, 0, 30)} 个工 × ${money(rec.dayRate)}`);
  else if (rec.unit === 'hour') parts.push(`${num(rec.hours, 0, 0, 24)} 小时 × ${money(rec.hourRate)}`);
  else parts.push('休息');
  if (num(rec.otHours, 0, 0, 24) > 0) parts.push(`加班 ${num(rec.otHours, 0, 0, 24)} 小时`);
  if (num(rec.pkgQty, 0, 0, 1e6) > 0) parts.push(`包工 ${num(rec.pkgQty)} × ${money(rec.pkgRate)}`);
  return parts.join(' · ');
}

/* ---------------- 周期结算 ---------------- */
function monthPeek(kind, mk) {
  return state.data[kind].monthly[mk] || defaultMonthlySeed(kind);
}

function cycleStats(y, m, kind) {
  kind = kind || state.active;
  const cyc = cycleRange(y, m);
  const mk = y + '-' + pad(m + 1);
  const mon = monthPeek(kind, mk);
  const dedTotal = round2(sum(mon.deductions.map(i => num(i.amount, 0, 0, 1e7))));
  const alwTotal = round2(sum(mon.allowances.map(i => num(i.amount, 0, 0, 1e7))));
  const shiftCount = {};
  ALL_SHIFTS.forEach(s => shiftCount[s] = 0);

  let hasAny = false, attendance = 0;
  const st = {
    kind, cyc, mk, deductions: mon.deductions, allowances: mon.allowances,
    dedTotal, alwTotal, shiftCount, hasAny, attendance
  };

  if (kind === 'regular') {
    const s = state.data.regular.settings;
    let base = 0, baseFull = 0, baseProrated = false, otPayGross = 0, leaveDeduct = 0, shortDeduct = 0;
    let workDays = 0, otHours = 0, otSplitDays = 0, otLegalPay = 0;
    const otRaw = { wd: 0, we: 0, hd: 0 };
    const hr = hourlyRateFor('regular', cyc);

    for (const k of cyc.dates) {
      const rec = state.data.regular.records[k];
      if (!rec) continue;
      hasAny = true;
      shiftCount[rec.shift] = (shiftCount[rec.shift] || 0) + 1;
      if (WORK_SHIFTS.includes(rec.shift)) {
        attendance++;
        workDays++;
        const ot = num(rec.otHours, 0, 0, 24);
        const parts = otPartsOf(k, rec);
        parts.forEach(p => { otRaw[p.key] += p.h; });
        otPayGross += sum(parts.map(p => p.h * p.mul)) * hr;
        otHours += ot;
        if (Array.isArray(rec.otSplit)) otSplitDays++;
        otLegalPay += ot * otMul(legalOtKey(k), s) * hr;
        shortDeduct += regularShortHours(rec) * hr;
      } else if (rec.shift === '事假' && !isOffDay(k, 'regular')) {
        leaveDeduct += s.hoursPerDay * hr;
      }
    }

    // 调休抵扣：默认从低倍率开始扣（先抵便宜的加班），也可改成从高倍率扣
    const leaveHours = num(mon.leaveHours, 0, 0, 744);
    const leaveOrder = mon.leaveOrder === 'high' ? 'high' : 'low';
    const order = leaveOrder === 'high' ? OT_KEYS.slice().reverse() : OT_KEYS.slice();
    let leaveLeft = leaveHours;
    const leaved = { wd: 0, we: 0, hd: 0 };
    for (const key of order) {
      if (leaveLeft <= 0) break;
      const take = Math.min(leaveLeft, otRaw[key]);
      leaved[key] = round2(take);
      otRaw[key] = round2(otRaw[key] - take);
      leaveLeft = round2(leaveLeft - take);
    }
    const leaveApplied = round2(sum(OT_KEYS.map(x => leaved[x])));
    const leaveExcess = round2(leaveLeft);
    const otPay = round2(sum(OT_KEYS.map(key => otRaw[key] * otMul(key, s) * hr)));
    const otWeekday = round2(otRaw.wd), otWeekend = round2(otRaw.we), otHoliday = round2(otRaw.hd);
    const payWeekday = round2(otWeekday * s.mulWeekday * hr);
    const payWeekend = round2(otWeekend * s.mulWeekend * hr);
    const payHoliday = round2(otHoliday * s.mulHoliday * hr);

    baseFull = hasAny ? s.baseSalary : 0;
    base = baseFull;
    // 结算本月：底薪只按「记过的应出勤日」折算，没记的日子不发底薪。
    // 与自然月/非自然月无关——直接数这个工资周期里已记录的日子。
    let recordedDays = 0;
    if (state.settleNow) {
      for (const k of cyc.dates) {
        if (isOffDay(k, 'regular')) continue;      // 休息日不在计薪天数里
        const rec = state.data.regular.records[k];
        if (!rec) continue;
        if (rec.shift === '休息') continue;        // 工作日记「休息」不发底薪
        recordedDays++;
        // 事假 / 病假照常计入，事假的扣款在后面单独减，避免双扣
      }
      const payDays = payDaysInCycle(cyc, 'regular');
      base = round2(baseFull * Math.min(recordedDays, payDays) / Math.max(1, payDays));
      baseProrated = true;
    }
    const baseDeduct = round2(leaveDeduct + shortDeduct);
    Object.assign(st, {
      hourlyRate: hr, base, baseFull, baseProrated, recordedDays,
      otPay: round2(otPay), otPayGross: round2(otPayGross),
      otLegalPay: round2(otLegalPay),
      otLoss: round2(otLegalPay - otPayGross),
      leaveCut: round2(otPayGross - otPay),
      leaveHours, leaveOrder, leaveApplied, leaveExcess,
      leaveParts: leaved,
      otSplitDays,
      rawOtParts: { wd: round2(otRaw.wd + leaved.wd), we: round2(otRaw.we + leaved.we), hd: round2(otRaw.hd + leaved.hd) },
      leaveDeduct: round2(leaveDeduct), shortDeduct: round2(shortDeduct), baseDeduct,
      workDays, otHours: round2(otHours), otWeekday, otWeekend, otHoliday,
      payWeekday, payWeekend, payHoliday,
      net: round2(base + otPay + alwTotal - baseDeduct - dedTotal),
      payDays: payDaysInCycle(cyc, 'regular')
    });
    st.hasAny = hasAny;
    st.attendance = attendance;
    return st;
  }

  if (kind === 'temp') {
    const s = state.data.temp.settings;
    const rateOut = num(s.rateOut, 0, 0, 1e6);
    let pay = 0, hours = 0, payOut = 0;
    for (const k of cyc.dates) {
      const rec = state.data.temp.records[k];
      if (!rec) continue;
      hasAny = true;
      shiftCount[rec.shift] = (shiftCount[rec.shift] || 0) + 1;
      attendance++;
      const h = num(rec.hours, 0, 0, 24);
      pay += h * num(rec.rate, 0, 0, 1e6);
      payOut += h * (rateOut > 0 ? rateOut : num(rec.rate, 0, 0, 1e6));
      hours += h;
    }
    Object.assign(st, {
      pay: round2(pay), hours: round2(hours),
      rateOut, payOut: round2(payOut), gap: rateOut > 0 ? round2(payOut - pay) : 0,
      net: round2(pay + alwTotal - dedTotal)
    });
    st.hasAny = hasAny;
    st.attendance = attendance;
    return st;
  }

  if (kind === 'piece') {
    let pay = 0, qty = 0, count = 0;
    const byItem = {};
    for (const k of cyc.dates) {
      const rec = state.data.piece.records[k];
      if (!rec) continue;
      hasAny = true;
      attendance++;
      count++;
      if (Array.isArray(rec.items)) {
        rec.items.forEach(it => {
          const q = num(it.qty, 0, 0, 1e6), r = num(it.rate, 0, 0, 1e6);
          pay += q * r;
          qty += q;
          const nm = it.name || '未命名';
          byItem[nm] = byItem[nm] || { qty: 0, pay: 0 };
          byItem[nm].qty += q;
          byItem[nm].pay += q * r;
        });
      }
    }
    Object.assign(st, {
      pay: round2(pay), qty: round2(qty), count, byItem,
      net: round2(pay + alwTotal - dedTotal)
    });
    st.hasAny = hasAny;
    st.attendance = attendance;
    return st;
  }

  // site
  const ss = state.data.site.settings;
  const dOut = num(ss.dayRateOut, 0, 0, 1e6);
  const hOut = num(ss.hourRateOut, 0, 0, 1e6);
  const oOut = num(ss.otRateOut, 0, 0, 1e6);
  let dayPay = 0, hourPay = 0, pkgPay = 0, otPay = 0, borrow = 0, settle = 0, units = 0, hours = 0, pkgQty = 0;
  let dayPayOut = 0, hourPayOut = 0, otPayOut = 0;
  let workDays = 0;
  for (const k of cyc.dates) {
    const rec = state.data.site.records[k];
    if (!rec) continue;
    hasAny = true;
    if (rec.type === 'borrow') { borrow += num(rec.amount, 0, 0, 1e7); continue; }
    if (rec.type === 'settle') { settle += num(rec.amount, 0, 0, 1e7); continue; }
    workDays++;
    attendance++;
    if (rec.unit === 'day') {
      const u = num(rec.units, 0, 0, 30), r = num(rec.dayRate, 0, 0, 1e6);
      dayPay += u * r; dayPayOut += u * (dOut > 0 ? dOut : r); units += u;
    } else if (rec.unit === 'hour') {
      const h = num(rec.hours, 0, 0, 24), r = num(rec.hourRate, 0, 0, 1e6);
      hourPay += h * r; hourPayOut += h * (hOut > 0 ? hOut : r); hours += h;
    }
    pkgPay += num(rec.pkgQty, 0, 0, 1e6) * num(rec.pkgRate, 0, 0, 1e6);
    pkgQty += num(rec.pkgQty, 0, 0, 1e6);
    const oh = num(rec.otHours, 0, 0, 24), or = num(rec.otRate, 0, 0, 1e6);
    otPay += oh * or; otPayOut += oh * (oOut > 0 ? oOut : or);
  }
  const gross = round2(dayPay + hourPay + pkgPay + otPay);
  const grossOut = round2(dayPayOut + hourPayOut + pkgPay + otPayOut);
  Object.assign(st, {
    dayPay: round2(dayPay), hourPay: round2(hourPay), pkgPay: round2(pkgPay), otPay: round2(otPay),
    grossOut, gap: round2(grossOut - gross), outEnabled: (dOut > 0 || hOut > 0 || oOut > 0),
    borrow: round2(borrow), settle: round2(settle), units: round2(units), hours: round2(hours), pkgQty: round2(pkgQty),
    workDays, gross,
    net: round2(gross + alwTotal - dedTotal - borrow - settle),
    unpaid: round2(gross + alwTotal - dedTotal - borrow - settle)
  });
  st.hasAny = hasAny;
  st.attendance = attendance;
  return st;
}

/** 某工种某自然年的总收入（按 12 个周期） */
function yearTotal(y, kind) {
  let v = 0;
  for (let m = 0; m < 12; m++) v += cycleStats(y, m, kind).net;
  return round2(v);
}

/** 某工种某年逐月净收入（画小柱状图用） */
function yearMonths(y, kind) {
  const out = [];
  for (let m = 0; m < 12; m++) out.push(cycleStats(y, m, kind).net);
  return out;
}

/* ---------------- 日历页 ---------------- */
function fmtMoneySigned(v) {
  if (!v) return '';
  const sign = v > 0 ? '+' : '-';
  return `<span class="d-wage ${v < 0 ? 'neg' : ''}">${sign}${moneyPlain(Math.abs(v))}</span>`;
}

/** 日历格子第二行的小字 */
function dayMiniText(kind, rec, k) {
  if (!rec) return '';
  if (kind === 'regular') {
    if (!WORK_SHIFTS.includes(rec.shift)) return rec.shift;
    const ot = num(rec.otHours, 0, 0, 24);
    if (ot > 0) return '加' + (ot % 1 ? ot.toFixed(1) : ot) + 'h';
    return rec.shift.slice(0, 1);
  }
  if (kind === 'temp') {
    const h = num(rec.hours, 0, 0, 24);
    return h ? (h % 1 ? h.toFixed(1) : h) + 'h' : (rec.shift === '休息' ? '休' : '');
  }
  if (kind === 'piece') {
    const q = pieceDayQty(rec);
    return q ? (q % 1 ? q.toFixed(1) : q) + (state.data.piece.settings.unit || '件') : '';
  }
  if (rec.type === 'borrow') return '借支';
  if (rec.type === 'settle') return '结算';
  if (rec.unit === 'day') {
    const u = num(rec.units, 0, 0, 30);
    return (u % 1 ? u.toFixed(1) : u) + '个工';
  }
  if (rec.unit === 'hour') {
    const h = num(rec.hours, 0, 0, 24);
    return (h % 1 ? h.toFixed(1) : h) + 'h';
  }
  if (num(rec.pkgQty, 0, 0, 1e6) > 0) return '包工';
  return '休息';
}

/** 汇总横幅右侧统计（按工种） */
function summaryStats(kind, st) {
  if (kind === 'regular') {
    const leaveTip = st.leaveApplied > 0 ? `（调休抵 ${st.leaveApplied}h）` : '';
    return `<div class="row"><b>${st.workDays}</b> 天上班</div>
      <div class="row"><b>${st.otHours % 1 ? st.otHours.toFixed(1) : st.otHours}</b> 小时加班${leaveTip}</div>
      <div class="row">时薪 <b>${money(st.hourlyRate)}</b></div>`;
  }
  if (kind === 'temp') {
    return `<div class="row"><b>${st.attendance}</b> 天出勤</div>
      <div class="row"><b>${st.hours % 1 ? st.hours.toFixed(1) : st.hours}</b> 小时</div>
      <div class="row">时薪 <b>${money(state.data.temp.settings.rate)}</b></div>`;
  }
  if (kind === 'piece') {
    return `<div class="row"><b>${st.count}</b> 天计件</div>
      <div class="row"><b>${st.qty % 1 ? st.qty.toFixed(1) : st.qty}</b> ${esc(state.data.piece.settings.unit || '件')}</div>
      <div class="row">共 <b>${st.byItem ? Object.keys(st.byItem).length : 0}</b> 个品项</div>`;
  }
  return `<div class="row"><b>${st.units % 1 ? st.units.toFixed(1) : st.units}</b> 个工</div>
    <div class="row">包工 <b>${st.pkgQty % 1 ? st.pkgQty.toFixed(1) : st.pkgQty}</b></div>
    <div class="row">加班 <b>${st.otPay ? st.otPay.toFixed(0) : 0}</b> 元</div>`;
}

function summaryNote(kind, st) {
  if (!st.hasAny) return '这个周期还没有记工，点下面开始记录';
  if (kind === 'regular') {
    let line = `底薪 ${money(st.base)} · 加班 ${money(st.otPay)} · 扣 ${money(st.dedTotal + st.baseDeduct)}`;
    if (st.leaveApplied > 0) line += ` · 调休抵 ${st.leaveApplied}h`;
    return line;
  }
  if (kind === 'temp') return `工时 ${st.hours} 小时 · 扣 ${money(st.dedTotal)}`;
  if (kind === 'piece') return `计件 ${st.qty} ${state.data.piece.settings.unit || '件'} · 扣 ${money(st.dedTotal)}`;
  return `点工 ${money(st.dayPay)} · 包工 ${money(st.pkgPay)} · 借支 ${money(st.borrow)}`;
}

function calendarPage() {
  const y = month.getFullYear(), m = month.getMonth();
  const kind = state.active;
  const cyc = cycleRange(y, m);
  const st = cycleStats(y, m, kind);
  const dict = state.data[kind].records;

  // 以周一为一周第一天（国内习惯）
  const gs = new Date(cyc.start); gs.setDate(gs.getDate() - ((gs.getDay() + 6) % 7));
  const ge = new Date(cyc.end); ge.setDate(ge.getDate() + (6 - ((ge.getDay() + 6) % 7)));
  const tk = todayKey();
  let cells = '';
  const cursor = new Date(gs);
  let guard = 0;
  while (cursor <= ge && guard++ < 60) {
    const k = ymd(cursor);
    const inCycle = cursor >= cyc.start && cursor <= cyc.end;
    const rec = dict[k];
    const off = !inCycle ? false : isOffDay(k);
    const isToday = k === tk;
    const hname = inCycle ? holidayName(k) : '';
    const dow = cursor.getDay();

    let cls = 'day';
    if (!inCycle) cls += ' outside';
    if (isToday) cls += ' is-today';
    if (inCycle && hname) cls += ' holiday';
    else if (inCycle && (dow === 0 || dow === 6)) cls += ' weekend';
    if (rec) cls += ' has';

    const lfest = inCycle && !hname ? lunarFestival(k) : '';
    let second = '';
    if (hname) second = `<span class="lunar">${esc(hname.slice(0, 3))}</span>`;
    else if (rec) {
      const t = dayMiniText(kind, rec, k);
      second = t ? `<span class="lunar">${esc(t)}</span>` : '';
    } else if (lfest) {
      second = `<span class="lunar lf">${esc(lfest.slice(0, 3))}</span>`;
    } else if (LUNAR_SUPPORT) {
      const lt = lunarText(k);
      if (lt) second = `<span class="lunar">${esc(lt)}</span>`;
    }

    let third = '';
    if (rec && inCycle) {
      const w = dayWage(k, rec, kind, cyc);
      if (kind === 'site' && rec.type === 'borrow') third = `<span class="d-wage neg">-${moneyPlain(rec.amount)}</span>`;
      else if (kind === 'site' && rec.type === 'settle') third = `<span class="d-wage neg">-${moneyPlain(rec.amount)}</span>`;
      else if (w) third = fmtMoneySigned(w);
    }

    const rest = inCycle && off ? '<span class="rest-tag">休</span>' : '';

    cells += `<button type="button" class="${cls}" data-action="edit-day" data-date="${k}" ${inCycle ? '' : 'disabled'} aria-label="${k}">
      ${rest}
      <span class="dnum">${cursor.getDate()}</span>
      ${second}
      ${third}
    </button>`;
    cursor.setDate(cursor.getDate() + 1);
  }

  const weekdays = ['一', '二', '三', '四', '五', '六', '日']
    .map((d, i) => `<span class="${i >= 5 ? 'we' : ''}">${d}</span>`).join('');

  const legend = legendHTML(kind);
  const modeNote = state.settleNow ? '<span class="tag">已按记录结算</span>' : '';

  return `
  <div class="monthbar">
    <button class="iconbtn" type="button" data-action="prev-month" aria-label="上个月">‹</button>
    <div class="month-title">
      <span class="eyebrow">${cyc.natural ? '自然月' : (state.cycleStartDay + ' 号起 · 工资周期')}</span>
      <strong>${cyc.natural ? `${y}年${m + 1}月` : cyc.label}</strong>
      <span class="tap-hint">${WORKER_META[kind].name} · 本月记录 ${Object.keys(dict).filter(k => k >= ymd(cyc.start) && k <= ymd(cyc.end)).length} 天</span>
    </div>
    <button class="iconbtn" type="button" data-action="next-month" aria-label="下个月">›</button>
  </div>

  <div class="summary">
    <div class="s-main">
      <div class="s-label">本月工资 ${modeNote}
        <button class="settle-mini ${state.settleNow ? 'on' : ''}" type="button" data-action="settle-now">${state.settleNow ? '恢复整月' : '结算本月'}</button>
      </div>
      <div class="s-money ${st.net < 0 ? 'neg' : ''}">${money(st.net)}</div>
      <div class="s-note">${summaryNote(kind, st)}</div>
    </div>
    <div class="s-stats">${summaryStats(kind, st)}</div>
  </div>

  ${missReminder(kind, cyc)}

  <div class="card calendar-card">
    <div class="week">${weekdays}</div>
    <div class="days">${cells}</div>
    <div class="cal-foot">${legend}</div>
  </div>

  <div class="cal-actions">
    <button class="btn btn-soft" type="button" data-action="open-timer">${ICON.clock}<span>计时</span></button>
    <button class="btn btn-primary" type="button" data-action="edit-today">
      ${ICON.plus}<span>记工</span>
    </button>
  </div>
  ${kind === 'site' ? `<div class="cal-actions" style="grid-template-columns:1fr;margin-top:9px">
    <button class="btn btn-ghost" type="button" data-action="edit-today" data-type="borrow">记借支 / 结算</button>
  </div>` : ''}
  <p class="footer-note">${WORKER_META[kind].name} · 点日期可补记或修改 · 数据只存在本机</p>`;
}

function legendHTML(kind) {
  const dot = (c, t) => `<span class="lg"><span class="dot" style="background:${c}"></span>${t}</span>`;
  if (kind === 'regular') {
    return dot('#5b8def', '上班') + dot('#b9c3d1', '休息') + dot('#e0533d', '事假') + dot('#e8b93a', '病假') + dot('#e0533d', '节假日') + `<span class="lg muted">灰「休」= 非工作日</span>`;
  }
  if (kind === 'temp') {
    return dot('#5b8def', '上班') + dot('#b9c3d1', '休息') + dot('#e0533d', '节假日') + `<span class="lg muted">记录工时 × 单价</span>`;
  }
  if (kind === 'piece') {
    return dot('#7a5cd6', '计件') + dot('#e0533d', '节假日') + `<span class="lg muted">件数 × 单价</span>`;
  }
  return dot('#189a63', '点工') + dot('#7a5cd6', '包工') + dot('#d97b1f', '借支') + dot('#8794a8', '结算') + `<span class="lg muted">绿「休」= 非工作日</span>`;
}

function missReminder(kind, cyc) {
  const tk = todayKey();
  const dict = state.data[kind].records;
  let missed = 0;
  for (const k of cyc.dates) {
    if (k >= tk) break;
    if (isOffDay(k)) continue;
    if (!dict[k]) missed++;
  }
  if (!missed) return '';
  return `<div class="reminder">${ICON.warn}<span>这个周期有 <b>${missed}</b> 个工作日还没记录</span>
    <button class="go" type="button" data-action="go-today">去记录</button></div>`;
}

function settleBreakdown(kind, st) {
  if (kind === 'regular') {
    const otSub = [];
    if (st.otWeekday > 0) otSub.push(`平时 ${st.otWeekday}h ${money(st.payWeekday)}`);
    if (st.otWeekend > 0) otSub.push(`周末 ${st.otWeekend}h ${money(st.payWeekend)}`);
    if (st.otHoliday > 0) otSub.push(`节假日 ${st.otHoliday}h ${money(st.payHoliday)}`);

      ? `加班费（原 ${st.otHours}h，抵扣后 ${otRest}h）`
      : `加班费（${st.otHours} 小时）`;
    const ded = st.deductions.filter(i => i.name || i.amount).map(i => `${esc(i.name || '扣款')} ${money(i.amount)}`).join('、') || '未设置';
    return liRow('底薪', money(st.base), { tag: st.baseProrated ? `已记录 ${st.recordedDays || 0} 天 / ${st.payDays || 0} 天` : '' })
      + liRow(otLabel, money(st.otPay), { sub: otSub.join(' · '), pos: st.otPay > 0 })
      + (st.otLoss > 0.005 ? liRow('倍率被调低', '-' + money(st.otLoss), { neg: true, sub: `按法定倍率应得 ${money(st.otLegalPay)}，实际 ${money(st.otPayGross)}` }) : '')
      + (st.otLoss < -0.005 ? liRow('倍率比法定高', '+' + money(-st.otLoss), { pos: true, sub: `按法定倍率应得 ${money(st.otLegalPay)}，实际 ${money(st.otPayGross)}` }) : '')
      + (st.leaveExcess > 0.005 ? liRow('调休多出', `${st.leaveExcess}h 未抵扣`, { sub: '本月加班已经全被调休抵掉，多出的部分不计' }) : '')
      + liRow('补贴', money(st.alwTotal), { pos: st.alwTotal > 0 })
      + liRow('扣款', st.dedTotal ? '-' + money(st.dedTotal) : money(0), { neg: st.dedTotal > 0, sub: ded })
      + (st.baseDeduct > 0 ? liRow('底薪扣款', '-' + money(st.baseDeduct), { neg: true, sub: `事假 ${money(st.leaveDeduct)} · 正班缺勤 ${money(st.shortDeduct)}` }) : '')
      + liRow('实发工资', money(st.net), { total: true });
  }
  if (kind === 'temp') {
    const ded = st.deductions.filter(i => i.name || i.amount).map(i => `${esc(i.name || '扣款')} ${money(i.amount)}`).join('、') || '未设置';
    const alw = st.allowances.filter(i => i.name || i.amount).map(i => `${esc(i.name || '补贴')} ${money(i.amount)}`).join('、') || '未设置';
    return liRow(`工时工资（${st.hours} 小时，到手价）`, money(st.pay), { pos: st.pay > 0 })
      + (st.rateOut > 0 ? liRow('应收（按对外价）', money(st.payOut), { sub: st.gap > 0.005 ? `差额 ${money(st.gap)} 没到手` : '和到手价一致' }) : '')
      + liRow('保险 / 扣款', st.dedTotal ? '-' + money(st.dedTotal) : money(0), { neg: st.dedTotal > 0, sub: ded })
      + liRow('补贴', money(st.alwTotal), { pos: st.alwTotal > 0, sub: alw })
      + liRow('实发工资', money(st.net), { total: true });
  }
  if (kind === 'piece') {
    const items = Object.entries(st.byItem || {}).map(([nm, v]) => `${esc(nm)} ${v.qty} × ${money(v.qty ? v.pay / v.qty : 0)} = ${money(v.pay)}`).join('；');
    const ded = st.deductions.filter(i => i.name || i.amount).map(i => `${esc(i.name || '扣款')} ${money(i.amount)}`).join('、') || '未设置';
    return liRow(`计件工资（${st.qty} ${esc(state.data.piece.settings.unit || '件')}）`, money(st.pay), { pos: st.pay > 0 })
      + (items ? `<div class="li-sub">${items}</div>` : '')
      + liRow('扣款', st.dedTotal ? '-' + money(st.dedTotal) : money(0), { neg: st.dedTotal > 0, sub: ded })
      + liRow('补贴', money(st.alwTotal), { pos: st.alwTotal > 0 })
      + liRow('实发工资', money(st.net), { total: true });
  }
  return liRow(`点工（${st.units} 个工）`, money(st.dayPay), { pos: st.dayPay > 0 })
    + liRow(`小时工（${st.hours} 小时）`, money(st.hourPay), { pos: st.hourPay > 0 })
    + liRow(`包工（${st.pkgQty} 件）`, money(st.pkgPay), { pos: st.pkgPay > 0 })
    + liRow('加班费', money(st.otPay), { pos: st.otPay > 0 })
    + (st.outEnabled ? liRow('应收（按对外单价）', money(st.grossOut), { sub: st.gap > 0.005 ? `差额 ${money(st.gap)} 没到手` : '和到手价一致' }) : '')
    + liRow('借支', st.borrow ? '-' + money(st.borrow) : money(0), { neg: st.borrow > 0 })
    + liRow('结算（已发）', st.settle ? '-' + money(st.settle) : money(0), { neg: st.settle > 0 })
    + liRow('应发合计', money(st.gross), {})
    + liRow('未结余款', money(st.net), { total: true });
}

    return `<div class="stat-grid">

      <div class="stat"><b>${st.payDays || 0}</b><span>本月应出勤</span></div>
    </div>
    <div class="shift-pills">${shiftPills(st)}</div>`;
  }
  if (kind === 'temp') {
    return `<div class="stat-grid">
      <div class="stat orange"><b>${st.attendance}</b><span>出勤天数</span></div>
      <div class="stat blue"><b>${st.hours}</b><span>总工时</span></div>

    return `<div class="stat-grid">
      <div class="stat purple"><b>${st.count}</b><span>计件天数</span></div>
      <div class="stat purple"><b>${st.qty}</b><span>总件数</span></div>

    <div class="cat purple"><div class="cat-name">包工 <span>${st.pkgQty} 件</span></div><div class="cat-val">${money(st.pkgPay)}</div><div class="cat-sub">按量结算</div></div>
    <div class="cat"><div class="cat-name">小时工 <span>${st.hours} 小时</span></div><div class="cat-val">${money(st.hourPay)}</div><div class="cat-sub">按时结算</div></div>
    <div class="cat orange"><div class="cat-name">借支</div><div class="cat-val">${money(st.borrow)}</div><div class="cat-sub">从工资中扣除</div></div>
    <div class="cat green"><div class="cat-name">结算</div><div class="cat-val">${money(st.settle)}</div><div class="cat-sub">已发放金额</div></div>
    <div class="cat"><div class="cat-name">未结余款</div><div class="cat-val">${money(st.net)}</div><div class="cat-sub">应发 - 借支 - 结算</div></div>
  </div>`;
}

function shiftPills(st) {
  const rows = ALL_SHIFTS.filter(s => st.shiftCount[s] > 0)
    .map(s => `<span class="pill ${SHIFT_CLASS[s]}">${s} ${st.shiftCount[s]} 天</span>`).join('');
  return rows || '<span class="muted small">这个周期还没有班次记录</span>';
}

function yearCard(kind) {
  const y = month.getFullYear();
  const months = yearMonths(y, kind);
  const total = round2(sum(months));
  const max = Math.max.apply(null, months.concat([1]));
  const curM = (month.getFullYear() === y) ? month.getMonth() : -1;
  const bars = months.map((v, i) => {
    const h = Math.max(3, Math.round(Math.abs(v) / max * 42));
    const cls = 'bar' + (v > 0 ? ' on' : '') + (i === curM ? ' cur' : '');
    return `<span class="${cls}" style="height:${h}px" title="${i + 1}月 ${money(v)}"></span>`;
  }).join('');
  const labels = months.map((v, i) => `<span class="${i === curM ? 'cur' : ''}">${i + 1}</span>`).join('');
  return `<div class="year-row"><span class="y">${y} 年累计（${WORKER_META[kind].name}）</span><span class="v">${money(total)}</span></div>
    <div class="year-bars">${bars}</div>
    <div class="year-labels">${labels}</div>`;
}

function recordList(kind, cyc) {
  const dict = state.data[kind].records;
  const rows = cyc.dates.slice().reverse().map(k => {
    const rec = dict[k];
    const d = parseD(k);
    const t = dateType(k);
    const badge = holidayName(k) ? `<span class="badge holiday">${esc(holidayName(k))}</span>`
      : (isOffDay(k) ? '<span class="badge rest">休</span>' : '');
    if (!rec) {
      return `<button class="rec-row empty-row" type="button" data-action="edit-day" data-date="${k}">
        <span class="datebox"><b>${d.getDate()}</b><small>${d.getMonth() + 1}月 周${WEEK_CN[d.getDay()]}</small></span>
        <span class="rec-info"><span class="t"><span class="txt muted">未记录 · 点击补记</span>${badge}</span></span>
        <span class="rec-amt zero">—</span>
      </button>`;
    }
    const w = dayWage(k, rec, kind, cyc);
    const totalW = kind === 'site' && (rec.type === 'borrow' || rec.type === 'settle') ? -num(rec.amount, 0, 0, 1e7) : w;
    const extraBadge = kind === 'site' && rec.type === 'borrow' ? '<span class="badge borrow">借支</span>'
      : kind === 'site' && rec.type === 'settle' ? '<span class="badge site">结算</span>' : '';
    return `<button class="rec-row" type="button" data-action="edit-day" data-date="${k}">
      <span class="datebox"><b>${d.getDate()}</b><small>${d.getMonth() + 1}月 周${WEEK_CN[d.getDay()]}</small></span>
      <span class="rec-info">
        <span class="t"><span class="txt">${esc(dayDesc(rec, kind))}</span>${badge}${extraBadge}</span>
        ${rec.note ? `<span class="note">${esc(rec.note)}</span>` : ''}
      </span>
      <span class="rec-amt ${totalW < 0 ? 'neg' : totalW === 0 ? 'zero' : ''}">${totalW ? (totalW > 0 ? '+' : '-') + moneyPlain(Math.abs(totalW)) : '—'}</span>
    </button>`;
  }).join('');
  return rows || '<div class="empty"><span class="big">☀️</span>这个周期还没有记录</div>';
}

function detailsPage() {
  const y = month.getFullYear(), m = month.getMonth();
  const kind = state.active;
  const cyc = cycleRange(y, m);
  const st = cycleStats(y, m, kind);

  const titleMap = { regular: '正式工结算', temp: '临时工结算', piece: '计件结算', site: '工地记工结算' };

  return `

    <div class="ph-main">
      <h2>${WORKER_META[kind].name}明细</h2>

  <section class="card settle-card">
    <div class="sc-top">

    </div>
    <div class="money-hero">

      <span class="unit">${kind === 'site' ? '未结余款' : '本月实发'}</span>
      <div class="delta">${kind === 'regular' ? `时薪 ${money(st.hourlyRate)}<br>${state.data.regular.settings.autoDays ? '应出勤 ' + (st.payDays || 0) + ' 天' : '计薪 ' + state.data.regular.settings.daysPerMonth + ' 天'}` : kind === 'temp' ? `工时 ${st.hours} 小时` : kind === 'piece' ? `${st.qty} ${esc(state.data.piece.settings.unit || '件')}` : `点工 ${st.units} 个工`}</div>

  <section class="card">
    <div class="card-head"><h2>${y} 年度</h2><span class="hint">按 ${WORKER_META[kind].name} 统计</span></div>

  <div class="grid2" style="margin-top:14px">
    <button class="btn btn-soft" type="button" data-action="payslip">${ICON.print}<span>工资条</span></button>
    <button class="btn btn-primary" type="button" data-action="edit-today">${ICON.plus}<span>记一笔</span></button>
  </div>
  <p class="footer-note">数据只存在本机 · 换设备前请先导出备份</p>`;
}

function numField(label, attr, value, unit, opt) {
  opt = opt || {};
  const v = (value === null || value === undefined || value === '' || value === 0) ? '' : value;
  return `<label class="field">${esc(label)}
    <div class="input-unit">
      <input type="text" readonly inputmode="none" data-num="${opt.dec === false ? 'int' : 'dec'}" data-set="${attr}"
        value="${esc(v)}" placeholder="${esc(opt.ph || '')}" aria-label="${esc(label)}">
      <span>${esc(unit || '')}</span>
    </div>
    ${opt.hint ? `<small class="help" style="display:block;margin-top:5px">${opt.hint}</small>` : ''}
  </label>`;
}

function switchRow(title, sub, attr, on) {
  return `<div class="switch-row">
    <div class="sw-txt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>
    <button class="switch ${on ? 'on' : ''}" type="button" role="switch" aria-checked="${on ? 'true' : 'false'}"
      data-action="toggle-set" data-attr="${attr}"></button>
  </div>`;
}

function workWeekPicker(wk) {
  const order = [1, 2, 3, 4, 5, 6, 0];
  return `<div class="week-picker">${order.map(i =>
    `<button class="wd ${wk[i] ? 'on' : ''}" type="button" data-action="toggle-workweek" data-dow="${i}" aria-pressed="${wk[i] ? 'true' : 'false'}">${WEEK_CN[i]}<small>${wk[i] ? '上班' : '休息'}</small></button>`
  ).join('')}</div>`;
}

function presetChips(wk) {
  const eq = a => a.length === wk.length && a.every((v, i) => v === wk[i]);
  const p5 = [0, 1, 1, 1, 1, 1, 0], p6 = [0, 1, 1, 1, 1, 1, 1], p7 = [1, 1, 1, 1, 1, 1, 1];
  return `<div class="preset-row">
    <button class="preset-chip ${eq(p5) ? 'on' : ''}" type="button" data-action="workweek-preset" data-preset="5">5 天 8 小时</button>
    <button class="preset-chip ${eq(p6) ? 'on' : ''}" type="button" data-action="workweek-preset" data-preset="6">6 天工作制</button>
    <button class="preset-chip ${eq(p7) ? 'on' : ''}" type="button" data-action="workweek-preset" data-preset="7">7 天全上班</button>
  </div>`;
}

function rateRows(items, prefix) {
  return items.map((it, i) => `<div class="rate-row">
    <div class="input-unit"><input type="text" readonly data-text="1" data-item="${prefix}:${i}:name" value="${esc(it.name || '')}" placeholder="产品 / 工序名称" aria-label="名称"></div>
    <div class="input-unit"><input type="text" readonly inputmode="none" data-num="dec" data-item="${prefix}:${i}:rate" value="${it.rate || ''}" placeholder="单价" aria-label="单价"></div>
    <button class="rate-del" type="button" data-action="del-rate" data-prefix="${prefix}" data-idx="${i}" aria-label="删除">×</button>
  </div>`).join('');
}

function miniRate(label, attr, val, hr) {
  return `<label class="field">${esc(label)}
    <div class="input-unit"><input type="text" readonly inputmode="none" data-num="dec" data-set="${attr}" value="${val}" aria-label="${label}"><span>倍</span></div>
    <small class="help" style="display:block;margin-top:5px">≈ ${money((hr || 0) * val)} / 时</small>
  </label>`;
}

function regularHourlyHint(s, st, m) {
  if (s.hourlyRate && s.hourlyRate > 0) {
    return `已自定义为 <b>${money(s.hourlyRate)}</b> / 小时。清空可恢复自动计算。`;
  }
  const cyc = cycleRange(m.getFullYear(), m.getMonth());
  const days = s.autoDays ? payDaysInCycle(cyc, 'regular') : s.daysPerMonth;
  return `自动：底薪 ÷（${days} × ${s.hoursPerDay}）= <b>${money(hourlyRateFor('regular', cyc))}</b> / 小时`;
}

function totalRecords() {
  return WORKER_ORDER.reduce((a, k) => a + Object.keys(state.data[k].records).length, 0);
}

function ensureMonthSeeds() {
  const kind = state.active;
  const mk = MONTH_KEY(month);
  if (!state.data[kind].monthly[mk]) state.data[kind].monthly[mk] = defaultMonthlySeed(kind);
}
/* =====================================================================
   记工编辑器（四工种各自字段）
   ===================================================================== */

let editingKey = null;
let editorDraft = null;
let editorKind = 'regular';

function blankDraft(kind, k) {
  if (kind === 'regular') {
    return { shift: '白班', otHours: '', regularHours: '', otSplit: [0, 0, 0], showSplit: false, note: '' };
  }
  if (kind === 'temp') {
    const s = state.data.temp.settings;
    return { shift: s.defaultShift || '白班', hours: '', rate: s.rate || '', note: '' };
  }
  if (kind === 'piece') {
    const s = state.data.piece.settings;
    const first = s.items[0] || { name: '', rate: 0 };
    return { items: [{ name: first.name || '', qty: '', rate: first.rate || '' }], note: '' };
  }
  const s = state.data.site.settings;
  return {
    type: 'work', unit: 'day', units: '1', hours: '', dayRate: s.dayRate || '', hourRate: s.hourRate || '',
    otHours: '', otRate: s.otRate || '', pkgQty: '', pkgRate: s.packageRate || '', amount: '', note: ''
  };
}

function draftFromRecord(kind, rec) {
  if (!rec) return null;
  if (kind === 'regular') {
    const split = Array.isArray(rec.otSplit) ? rec.otSplit.slice(0, 3) : null;
    return {
      shift: rec.shift,
      otHours: rec.otHours ? String(rec.otHours) : '',
      regularHours: (rec.regularHours === null || rec.regularHours === undefined) ? '' : String(rec.regularHours),
      otSplit: split ? split.map(x => num(x, 0, 0, 24)) : [0, 0, 0],
      showSplit: !!split,
      note: rec.note || ''
    };
  }
  if (kind === 'temp') {
    return { shift: rec.shift, hours: rec.hours ? String(rec.hours) : '', rate: rec.rate ? String(rec.rate) : '', note: rec.note || '' };
  }
  if (kind === 'piece') {
    const items = (rec.items || []).map(it => ({ name: it.name || '', qty: it.qty ? String(it.qty) : '', rate: it.rate ? String(it.rate) : '' }));
    return { items: items.length ? items : [{ name: '', qty: '', rate: '' }], note: rec.note || '' };
  }
  return {
    type: rec.type || 'work',
    unit: rec.unit || 'day',
    units: rec.units ? String(rec.units) : '',
    hours: rec.hours ? String(rec.hours) : '',
    dayRate: rec.dayRate ? String(rec.dayRate) : '',
    hourRate: rec.hourRate ? String(rec.hourRate) : '',
    otHours: rec.otHours ? String(rec.otHours) : '',
    otRate: rec.otRate ? String(rec.otRate) : '',
    pkgQty: rec.pkgQty ? String(rec.pkgQty) : '',
    pkgRate: rec.pkgRate ? String(rec.pkgRate) : '',
    amount: rec.amount ? String(rec.amount) : '',
    note: rec.note || ''
  };
}

function openEditor(k, opt) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
  opt = opt || {};
  // 先把键盘收起来并移回 body：下面要整体重写 editor 的 innerHTML，
  // 键盘如果正挂在 dialog 里会被一起删掉，之后再也弹不出来。
  if (window.GongKeypad) window.GongKeypad.close();
  editingKey = k;
  editorKind = state.active;
  const rec = state.data[editorKind].records[k] || null;
  editorDraft = draftFromRecord(editorKind, rec) || blankDraft(editorKind, k);
  if (opt.type === 'borrow' && editorKind === 'site') editorDraft.type = 'borrow';
  $('editor').innerHTML = editorShell(rec);
  openSheet($('editor'));
  bindEditorStatic();
}

function editorShell(rec) {
  const d = parseD(editingKey);
  const kind = editorKind;
  const t = dateType(editingKey);
  const off = isOffDay(editingKey);
  const typeBadge = t === 'holiday' ? `<span class="badge holiday">${esc(holidayName(editingKey) || '节假日')}</span>`
    : off ? '<span class="badge rest">休息日</span>' : '<span class="badge weekend">工作日</span>';
  return `<div class="sheet-inner">
    <div class="grip"></div>
    <div class="sheet-head">
      <div>
        <p>${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WEEK_CN[d.getDay()]} ${typeBadge}</p>
        <h2>记工 · ${WORKER_META[kind].name}</h2>
      </div>
      <button class="close-x" type="button" data-action="close-editor" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="editorBody">${editorBodyHTML(rec)}</div>
    <div class="sheet-foot row">
      ${rec ? '<button class="btn btn-danger" type="button" data-action="del-record">删除</button>' : ''}
      <button class="btn btn-primary" type="button" data-action="save-entry">保存</button>
    </div>
  </div>`;
}

    <button class="qbtn ${t === 'workday' ? 'on' : ''}" type="button" data-action="set-daytype" data-t="workday">按上班日</button>
    <button class="qbtn ${t === 'holiday' ? 'on' : ''}" type="button" data-action="set-daytype" data-t="holiday">按休息日</button>

}

             <div class="input-unit"><input type="text" readonly inputmode="none" data-num="dec" data-field="otHours" value="${esc(draft.otHours)}" placeholder="0" aria-label="加班小时"><span>小时</span></div>
           </label>
           <div class="quick-row">${[0, 1, 2, 3, 4, 6].map(v => `<button class="qbtn" type="button" data-action="quick-ot" data-v="${v}">${v ? v + 'h' : '无加班'}</button>`).join('')}</div>
           ${otSplitEditor()}
           <label class="field">正班实际工时（不满 ${full} 小时扣底薪）
             <div class="input-unit"><input type="text" readonly inputmode="none" data-num="dec" data-field="regularHours" value="${esc(draft.regularHours)}" placeholder="${full}" aria-label="正班工时"><span>小时</span></div>
           </label>

          <button class="${draft.unit === 'hour' ? 'on' : ''}" type="button" data-action="site-unit" data-v="hour">小时<small>按工时</small></button>
          <button class="${draft.unit === 'rest' ? 'on' : ''}" type="button" data-action="site-unit" data-v="rest">休息<small>没干活</small></button>
        </div>
        ${draft.unit === 'day' ? `
          <div class="grid2">
            ${numLike('个数（1 个工 = 1 天）', 'units', draft.units, '个工', s.dayRate)}
            ${numLike('日薪', 'dayRate', draft.dayRate, '元 / 工', s.dayRate)}
          </div>
          <div class="quick-row">${[0.5, 1, 1.5, 2, 3].map(v => `<button class="qbtn" type="button" data-action="quick-units" data-v="${v}">${v}个工</button>`).join('')}</div>` : ''}
        ${draft.unit === 'hour' ? `
          <div class="grid2">
            ${numLike('工时', 'hours', draft.hours, '小时', s.hourRate)}
            ${numLike('时薪', 'hourRate', draft.hourRate, '元 / 小时', s.hourRate)}
          </div>
          <div class="quick-row">${[2, 4, 6, 8, 10, 12].map(v => `<button class="qbtn" type="button" data-action="quick-hours" data-v="${v}">${v}h</button>`).join('')}</div>` : ''}
        ${draft.unit === 'rest' ? '<div class="ed-calcs">休息这一天不算钱，可以留空直接保存。</div>' : ''}
        ${draft.unit !== 'rest' ? `
          <div class="field-title">加班（可选）</div>
          <div class="grid2">
            ${numLike('加班小时', 'otHours', draft.otHours, '小时', '')}
            ${numLike('加班单价', 'otRate', draft.otRate, '元 / 小时', s.otRate)}
          </div>
          <div class="field-title">包工（可选）</div>
          <div class="grid2">
            ${numLike('包工数量', 'pkgQty', draft.pkgQty, '件 / ㎡', s.packageRate)}
            ${numLike('包工单价', 'pkgRate', draft.pkgRate, '元 / 单位', s.packageRate)}
          </div>` : ''}
        <div class="ed-calcs" id="calcHint">${siteCalcText()}</div>
      ` : `
        <label class="field">${draft.type === 'borrow' ? '借支金额' : '已结算金额'}
          <div class="input-unit"><input type="text" readonly inputmode="none" data-num="dec" data-field="amount" value="${esc(draft.amount)}" placeholder="0" aria-label="${draft.type === 'borrow' ? '借支金额' : '已结算金额'}"><span>元</span></div>
        </label>
        <div class="ed-calcs">${draft.type === 'borrow' ? '借支会从工资里扣掉，不参与点工/包工合计。' : '结算表示已经拿到手的钱，会从未结余款里扣掉。'}</div>
      `}`;
  }
  return `${body}
    <label class="field">备注
      <div class="input-unit"><input type="text" readonly data-text="1" data-field="note" value="${esc(draft.note)}" maxlength="100" placeholder="选填，100 字以内" aria-label="备注"></div>
    </label>
    <div class="error" id="entryError" role="alert" style="color:var(--red);font-size:12px;min-height:16px;margin-top:6px"></div>`;
}

function numLike(label, field, val, unit, hintVal) {
  return `<label class="field">${esc(label)}
    <div class="input-unit"><input type="text" readonly inputmode="none" data-num="dec" data-field="${field}" value="${esc(val)}" placeholder="${hintVal || ''}" aria-label="${esc(label)}"><span>${esc(unit)}</span></div>
  </label>`;
}

/* ---------- 加班倍率拆分（公司不按法定倍率时用） ---------- */
const SPLIT_FIELDS = ['otwd', 'otwe', 'othd'];

function otSplitSum() {
  return round2(sum((editorDraft.otSplit || []).map(x => num(x, 0, 0, 24))));
}

function otSplitTotalText() {
  const total = num(editorDraft.otHours, 0, 0, 24);
  const got = otSplitSum();
  const diff = round2(total - got);
  const ok = Math.abs(diff) < 0.005;
  return `合计 ${got} / 总加班 ${total} 小时 <b class="${ok ? 'pos' : 'neg'}">${ok ? '✓ 对上了' : '还差 ' + diff + ' 小时'}</b>`;
}

function otSplitEditor() {
  const s = state.data.regular.settings;
  const d = editorDraft;
  const rows = OT_KEYS.map((key, i) => {
    const v = num((d.otSplit || [])[i], 0, 0, 24);
    return `<div class="ot-row">
      <span class="ot-name">${OT_LABEL[key]}<em>×${num(s[OT_MULKEY[key]], 1, 0, 10)}</em></span>
      <div class="input-unit"><input type="text" readonly inputmode="none" data-num="dec" data-field="${SPLIT_FIELDS[i]}" value="${v ? String(v) : ''}" placeholder="0" aria-label="${OT_LABEL[key]}加班小时"><span>小时</span></div>
    </div>`;
  }).join('');
  return `<div class="ot-split">
    <button class="textbtn" type="button" data-action="toggle-otsplit">${d.showSplit ? '收起「倍率拆分」' : '公司不按法定倍率算？改这里'}</button>
    ${d.showSplit ? `<div class="ot-split-body">
      <p class="help">加班可以拆成几段不同倍率（比如 3 小时按 3 倍、2 小时按 2 倍）。改一段，其余自动补，总小时不变。</p>
      ${rows}
      <div class="ot-total" id="otTotal">${otSplitTotalText()}</div>
    </div>` : ''}
  </div>`;
}

/** 自动调平：改一档，差额从其它档补/扣，总和保持等于总加班 */
function rebalanceSplit(changedIdx, val) {
  const total = num(editorDraft.otHours, 0, 0, 24);
  const arr = (editorDraft.otSplit || [0, 0, 0]).map((x, i) => i === changedIdx ? val : num(x, 0, 0, 24));
  let diff = round2(sum(arr) - total);
  if (diff > 0) {
    for (const j of [0, 1, 2]) {
      if (j === changedIdx) continue;
      const take = Math.min(arr[j], diff);
      arr[j] = round2(arr[j] - take);
      diff = round2(diff - take);
      if (diff <= 0) break;
    }
  } else if (diff < 0) {
    const j = [1, 2, 0].find(x => x !== changedIdx);
    arr[j] = round2(arr[j] + (-diff));
  }
  editorDraft.otSplit = arr;
}

function syncSplitInputs() {
  SPLIT_FIELDS.forEach((f, i) => {
    const inp = document.querySelector(`#editorBody input[data-field="${f}"]`);
    if (inp) {
      const v = num((editorDraft.otSplit || [])[i], 0, 0, 24);
      inp.value = v ? String(v) : '';
    }
  });
  const t = $('otTotal');
  if (t) t.innerHTML = otSplitTotalText();
}

/* ---------- 计算提示 ---------- */
function regularCalcText() {
  const s = state.data.regular.settings;
  const hr = hourlyRateFor('regular', currentCycle());
  const ot = Number(editorDraft.otHours) || 0;
  const rh = editorDraft.regularHours === '' ? s.hoursPerDay : Number(editorDraft.regularHours);
  const short = Math.max(0, s.hoursPerDay - rh);
  let txt = '';
  if (editorDraft.showSplit) {
    const parts = OT_KEYS.map((key, i) => ({ key, h: num((editorDraft.otSplit || [])[i], 0, 0, 24) })).filter(p => p.h > 0);
    const pay = sum(parts.map(p => p.h * num(s[OT_MULKEY[p.key]], 1, 0, 10))) * hr;
    if (parts.length) {
      txt = parts.map(p => `${OT_LABEL[p.key]} ${p.h}h ×${num(s[OT_MULKEY[p.key]], 1, 0, 10)}`).join(' + ') + ` = ${money(pay)}`;
    } else {
      txt = '还没拆，填一下各档小时';
    }
    const legalKey = legalOtKey(editingKey);
    const legal = ot * num(s[OT_MULKEY[legalKey]], 1, 0, 10) * hr;
    if (Math.abs(legal - pay) > 0.005) {
      txt += `；按法定（${OT_LABEL[legalKey]} ×${num(s[OT_MULKEY[legalKey]], 1, 0, 10)}）应 ${money(legal)}，少 ${money(legal - pay)}`;
    }
  } else {
    const mul = multiplierFor(editingKey);
    const t = dateType(editingKey);
    const label = t === 'holiday' ? '节假日' : t === 'weekend' ? '周末' : '平时';
    txt = `${label}：${money(hr)} × ${mul} 倍 × ${ot} 小时 = ${money(ot * hr * mul)}`;
  }
  if (short > 0) txt += `；正班少 ${short} 小时，扣 ${money(short * hr)}`;
  return txt;
}

function tempCalcText() {
  const h = Number(editorDraft.hours) || 0;
  const r = editorDraft.rate === '' ? state.data.temp.settings.rate : Number(editorDraft.rate);
  return `${h} 小时 × ${money(r)} = <b>${money(h * r)}</b>`;
}

function pieceCalcTotal() {
  return round2(sum((editorDraft.items || []).map(it => (Number(it.qty) || 0) * (Number(it.rate) || 0))));
}

function siteCalcText() {
  const d = editorDraft;
  const parts = [];
  let total = 0;
  if (d.unit === 'day') {
    const v = (Number(d.units) || 0) * (Number(d.dayRate) || 0);
    total += v;
    parts.push(`${Number(d.units) || 0} 个工 × ${money(Number(d.dayRate) || 0)} = ${money(v)}`);
  } else if (d.unit === 'hour') {
    const v = (Number(d.hours) || 0) * (Number(d.hourRate) || 0);
    total += v;
    parts.push(`${Number(d.hours) || 0} 小时 × ${money(Number(d.hourRate) || 0)} = ${money(v)}`);
  }
  const ot = (Number(d.otHours) || 0) * (Number(d.otRate) || 0);
  if (ot) { total += ot; parts.push(`加班 ${money(ot)}`); }
  const pk = (Number(d.pkgQty) || 0) * (Number(d.pkgRate) || 0);
  if (pk) { total += pk; parts.push(`包工 ${money(pk)}`); }
  if (!parts.length) return '还没填工量，填完这里会算钱。';
  return parts.join(' · ') + ` ≈ <b>${money(total)}</b>`;
}

/* ---------- 交互 ---------- */
function bindEditorStatic() {
  const body = $('editorBody');
  if (!body) return;
  body.addEventListener('input', onEditorInput);
  body.addEventListener('change', onEditorInput);
  syncCalcHint();
}

function onEditorInput(e) {
  const t = e.target;
  if (!t || !t.dataset || !t.dataset.field) return;
  const f = t.dataset.field;
  if (f.indexOf('pname') === 0) {
    const i = Number(f.replace('pname', ''));
    if (editorDraft.items[i]) editorDraft.items[i].name = t.value;
    onPieceNameChange(i, t.value);
    return;
  }
  if (f.indexOf('pqty') === 0) {
    const i = Number(f.replace('pqty', ''));
    if (editorDraft.items[i]) editorDraft.items[i].qty = t.value;
    syncCalcHint();
    return;
  }
  if (f.indexOf('prate') === 0) {
    const i = Number(f.replace('prate', ''));
    if (editorDraft.items[i]) editorDraft.items[i].rate = t.value;
    syncCalcHint();
    return;
  }
  if (SPLIT_FIELDS.includes(f)) {
    const idx = SPLIT_FIELDS.indexOf(f);
    const v = t.value === '' ? 0 : num(t.value, 0, 0, 24);
    rebalanceSplit(idx, v);
    syncSplitInputs();
    syncCalcHint();
    return;
  }
  editorDraft[f] = t.value;
  syncCalcHint();
}

function onPieceNameChange(i, name) {
  const s = state.data.piece.settings;
  const found = s.items.find(x => x.name === name);
  if (found && editorDraft.items[i]) {
    editorDraft.items[i].rate = String(found.rate || '');
    const row = document.querySelector(`#editorBody .piece-row[data-pi="${i}"]`);
    if (row) {
      const ri = row.querySelector('input[data-field^="prate"]');
      if (ri) ri.value = found.rate || '';
    }
    syncCalcHint();
  }
}

function syncCalcHint() {
  const el = $('calcHint');
  if (!el || !editorDraft || !editingKey) return;
  if (editorKind === 'regular') el.innerHTML = regularCalcText();
  else if (editorKind === 'temp') el.innerHTML = tempCalcText();
  else if (editorKind === 'piece') el.innerHTML = money(pieceCalcTotal());
  else if (editorKind === 'site' && editorDraft.type === 'work') el.innerHTML = siteCalcText();
}

function readEditorValues() {
  // 已由 input 事件同步；这里补一遍防止键盘输入未触发 input
  $$('#editorBody input[data-field]').forEach(inp => {
    const f = inp.dataset.field;
    if (f.indexOf('pname') === 0) {
      const i = Number(f.replace('pname', ''));
      if (editorDraft.items[i]) editorDraft.items[i].name = inp.value;
    } else if (f.indexOf('pqty') === 0) {
      const i = Number(f.replace('pqty', ''));
      if (editorDraft.items[i]) editorDraft.items[i].qty = inp.value;
    } else if (f.indexOf('prate') === 0) {
      const i = Number(f.replace('prate', ''));
      if (editorDraft.items[i]) editorDraft.items[i].rate = inp.value;
    } else if (SPLIT_FIELDS.includes(f)) {
      const idx = SPLIT_FIELDS.indexOf(f);
      if (!Array.isArray(editorDraft.otSplit)) editorDraft.otSplit = [0, 0, 0];
      editorDraft.otSplit[idx] = inp.value === '' ? 0 : num(inp.value, 0, 0, 24);
    } else {
      editorDraft[f] = inp.value;
    }
  });
}

function refreshEditorBody() {
  const box = $('editorBody');
  if (!box) return;
  const rec = state.data[editorKind].records[editingKey] || null;
  box.innerHTML = editorBodyHTML(rec);
  syncCalcHint();
}

function saveEntry() {
  const k = editingKey, kind = editorKind;
  readEditorValues();
  const err = $('entryError');
  const fail = msg => { if (err) err.textContent = msg; };
  if (err) err.textContent = '';
  const note = String(editorDraft.note || '').slice(0, 100);
  let rec = null;

  if (kind === 'regular') {
    const shift = editorDraft.shift;
    const isLeave = !WORK_SHIFTS.includes(shift);
    const ot = Number(editorDraft.otHours) || 0;
    const rh = editorDraft.regularHours === '' ? null : Number(editorDraft.regularHours);
    if (ot < 0 || ot > 24) return fail('加班小时要在 0–24 之间');
    if (rh !== null && (rh < 0 || rh > 24)) return fail('正班工时要在 0–24 之间');
    let otSplit = null;
    if (!isLeave && editorDraft.showSplit) {
      const arr = (editorDraft.otSplit || [0, 0, 0]).map(x => round2(num(x, 0, 0, 24)));
      const ssum = round2(sum(arr));
      if (ssum > 0) {
        if (Math.abs(ssum - ot) > 0.005) return fail(`拆分合计 ${ssum} 小时，和加班总数 ${ot} 小时对不上`);
        otSplit = arr;
      }
    }
    rec = { shift, otHours: isLeave ? 0 : ot, otSplit: isLeave ? null : otSplit, regularHours: isLeave ? null : (rh === null || rh >= state.data.regular.settings.hoursPerDay ? null : rh), note };
  } else if (kind === 'temp') {
    const hours = Number(editorDraft.hours) || 0;
    const rate = editorDraft.rate === '' ? state.data.temp.settings.rate : Number(editorDraft.rate) || 0;
    if (hours < 0 || hours > 24) return fail('工时要在 0–24 之间');
    if (rate < 0) return fail('单价不能是负数');
    if (editorDraft.shift !== '休息' && hours === 0 && !note) return fail('填一下工时，或者选「休息」');
    rec = { shift: editorDraft.shift, hours: editorDraft.shift === '休息' ? 0 : hours, rate, note };
  } else if (kind === 'piece') {
    const items = (editorDraft.items || []).map(it => ({
      name: String(it.name || '').slice(0, 20),
      qty: Number(it.qty) || 0,
      rate: Number(it.rate) || 0
    })).filter(it => it.qty > 0 || it.rate > 0 || it.name);
    if (!items.length) return fail('至少填一行件数和单价');
    for (const it of items) {
      if (it.qty < 0 || it.qty > 1e6) return fail('数量不对');
      if (it.rate < 0) return fail('单价不能是负数');
      if (it.qty > 0 && it.rate === 0) return fail(`「${it.name || '未命名'}」还没填单价`);
    }
    rec = { items, note };
  } else {
    const d = editorDraft;
    if (d.type === 'work') {
      if (d.unit === 'day') {
        const u = Number(d.units) || 0;
        const r = Number(d.dayRate) || 0;
        if (u < 0 || u > 30) return fail('个工数要在 0–30 之间');
        if (u > 0 && r <= 0) return fail('填一下日薪（元 / 个工）');
        rec = { type: 'work', unit: 'day', units: u, dayRate: r, hours: 0, hourRate: 0, otHours: Number(d.otHours) || 0, otRate: Number(d.otRate) || 0, pkgQty: Number(d.pkgQty) || 0, pkgRate: Number(d.pkgRate) || 0, amount: 0, note };
      } else if (d.unit === 'hour') {
        const h = Number(d.hours) || 0;
        const r = Number(d.hourRate) || 0;
        if (h < 0 || h > 24) return fail('工时要在 0–24 之间');
        if (h > 0 && r <= 0) return fail('填一下时薪');
        rec = { type: 'work', unit: 'hour', hours: h, hourRate: r, units: 0, dayRate: 0, otHours: Number(d.otHours) || 0, otRate: Number(d.otRate) || 0, pkgQty: Number(d.pkgQty) || 0, pkgRate: Number(d.pkgRate) || 0, amount: 0, note };
      } else {
        rec = { type: 'work', unit: 'rest', units: 0, hours: 0, dayRate: 0, hourRate: 0, otHours: 0, otRate: 0, pkgQty: 0, pkgRate: 0, amount: 0, note };
      }
    } else {
      const amt = Number(d.amount) || 0;
      if (amt <= 0) return fail(d.type === 'borrow' ? '填一下借支金额' : '填一下结算金额');
      rec = { type: d.type, unit: 'day', units: 0, hours: 0, dayRate: 0, hourRate: 0, otHours: 0, otRate: 0, pkgQty: 0, pkgRate: 0, amount: amt, note };
    }
  }

  state.data[kind].records[k] = rec;
  persist(true);
  if (window.GongKeypad) window.GongKeypad.close();
  $('editor').close();
  editingKey = null;
  // 如果补记的日期不在当前查看的周期，自动跳到那个周期，避免"存了却看不到"
  const cycM = cycleMonthOf(k);
  if (cycM.y !== month.getFullYear() || cycM.m !== month.getMonth()) {
    month = new Date(cycM.y, cycM.m, 1);
  }
  render();
  toast(kind === 'site' && rec.type === 'borrow' ? '借支已记' : kind === 'site' && rec.type === 'settle' ? '结算已记' : '已保存');
}

function deleteCurrentRecord() {
  if (!editingKey) return;
  const k = editingKey, kind = editorKind;
  confirmDialog('删除记录', '这一天（' + k + '）的记录会被删除，确定吗？', () => {
    delete state.data[kind].records[k];
    persist(true);
    $('editor').close();
    editingKey = null;
    render();
    toast('已删除');
  });
}

function openSheet(el) {
  try { el.showModal(); } catch (e) { el.setAttribute('open', ''); }
  setTimeout(() => {
    try {
      const a = document.activeElement;
      if (a && a.closest && a.closest('dialog')) a.blur();

let toastTimer = 0;
function toast(msg) {
  const el = $('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

let confirmCb = null;
function confirmDialog(title, text, cb) {
  const el = $('confirmDialog');
  if (!el) return;
  $('confirmTitle').textContent = title;
  $('confirmText').textContent = text;
  confirmCb = cb;

/* ==================== 关于 ==================== */
function sourceJS() {
  return $$('script').map(s => s.textContent).join('\n');
}

function sourceHTML() {
  const clone = document.documentElement.cloneNode(true);
  clone.removeAttribute('style');
  const bodyEl = clone.querySelector('body');
  if (bodyEl) {
    bodyEl.removeAttribute('style');
    bodyEl.className = String(bodyEl.className || '').replace(/\b(has-bg-image|bg-custom|bg-blur|bg-glass|kp-open)\b/g, '').replace(/\s+/g, ' ').trim();
  }
  // 去掉壁纸图层的运行时样式，避免把用户的照片塞进源码
  ['wallpaper', 'wallImg', 'wallScrim', 'kpBubble'].forEach(id => {
    const n = clone.querySelector('#' + id);
    if (n) { n.removeAttribute('style'); n.classList.remove('on'); n.textContent = id === 'kpBubble' ? '' : n.textContent; }
  });
  const main = clone.querySelector('#main');
  if (main) main.innerHTML = '';
  clone.querySelectorAll('dialog').forEach(d => { d.innerHTML = ''; d.removeAttribute('open'); });
  const kp = clone.querySelector('#keypad');
  if (kp) { kp.classList.remove('on'); kp.setAttribute('aria-hidden', 'true'); }
  const tst = clone.querySelector('#toast');
  if (tst) { tst.className = 'toast'; tst.textContent = ''; }
  const pa = clone.querySelector('#printArea');
  if (pa) pa.innerHTML = '';
  const bg = clone.querySelector('#bgBtn');
  if (bg) bg.removeAttribute('style');
  return '<!doctype html>\n' + clone.outerHTML;
}

function copyText(text, btn) {
  const done = ok => {
    if (!btn) return;
    const old = btn.dataset.old || btn.textContent;
    btn.dataset.old = old;
    btn.textContent = ok ? '已复制' : '复制失败';
    btn.classList.toggle('done', ok);
    setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1800);
  };
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      done(ok);
    } catch (e) { done(false); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true)).catch(fallback);
  } else fallback();
}

/* ---------- 键盘来源：内置 / 手机自带 ---------- */
function sysKbOn() {
  try { return localStorage.getItem('gongshi_syskb') === '1'; } catch (e) { return false; }

/** 把主题应用到页面：壁纸用独立固定图层，不依赖 body 背景 */
function applyBackground() {
  const body = document.body;
  if (!body) return;
  const custom = !!theme.image;
  const alpha = theme.cardAlpha == null ? 0.86 : theme.cardAlpha;
  const root = document.documentElement;
  try {
    root.style.setProperty('--card-alpha', String(alpha));
    root.style.setProperty('--surf-a', String(alpha));
    root.style.setProperty('--surf-a2', String(Math.min(1, alpha + 0.16)));
    // 明细/设置页底色略实于日历，但跟随滑块变化，保留清晰的壁纸透出。
    root.style.setProperty('--surf-b', String(Math.min(1, Math.max(0.4, alpha + 0.12))));
  } catch (e) { }
  body.classList.toggle('has-bg-image', custom);
  body.classList.toggle('bg-custom', custom || theme.preset !== 'default');
  body.classList.toggle('bg-glass', !!theme.glass);

  const wall = $('wallpaper'), img = $('wallImg'), scrim = $('wallScrim');
  if (wall) wall.style.background = custom ? 'transparent' : bgPresetCss();
  if (img) {
    img.style.backgroundImage = custom ? `url("${theme.image}")` : 'none';
    img.style.backgroundSize = theme.fit === 'contain' ? 'contain' : 'cover';
    const blur = Number(theme.blurPx) || 0;
    img.style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
  }
  if (scrim) scrim.style.opacity = custom ? String(theme.dim) : '0';
  // body 不再画背景图，避免安卓 WebView 上 background-attachment 失效
  body.style.backgroundImage = '';
  body.style.backgroundSize = '';
  body.style.backgroundPosition = '';
}

function applyPhotoDefaults() {

function handleBgFile(file) {
  if (!file) return;
  if (!/^image\//.test(file.type || '') && !/\.(jpe?g|png|webp|gif|bmp)$/i.test(file.name || '')) {
    toast('请选择图片文件');
    return;
  }
  toast('正在处理图片…');
  const reader = new FileReader();
  reader.onerror = () => toast('图片读取失败，换一张试试');
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => toast('这张图片打不开，换一张试试');
    img.onload = () => {
      try {
        const maxW = 1080;
        const scale = Math.min(1, maxW / Math.max(1, img.width));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        theme.image = cv.toDataURL('image/jpeg', 0.72);
        theme.preset = 'default';
        applyPhotoDefaults();
        const okSaved = persist(true);
        applyBackground();
        openBg();
        toast(okSaved ? '壁纸已换好，可以拉滑块微调' : '壁纸已换好，但保存失败（图片太大）');
      } catch (e) {
        toast('图片处理失败：' + (e && e.message ? e.message : e));
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function payslipMeta() {
  const kind = state.active;
  const y = month.getFullYear(), m = month.getMonth();
  const cyc = cycleRange(y, m);
  const st = cycleStats(y, m, kind);
  return { kind, y, m, cyc, st };
}

function payslipRows(kind, st) {
  if (kind === 'regular') {
    return [
      ['底薪', money(st.base)],
      ['加班费（' + st.otHours + ' 小时）', money(st.otPay)],
      ['补贴', money(st.alwTotal)],
      ['社保公积金等扣款', '-' + money(st.dedTotal)],
      ['缺勤 / 事假扣款', '-' + money(st.baseDeduct)]
    ];
  }
  if (kind === 'temp') {
    return [
      ['工时工资（' + st.hours + ' 小时）', money(st.pay)],
      ['保险 / 扣款', '-' + money(st.dedTotal)],
      ['补贴', money(st.alwTotal)]
    ];
  }
  if (kind === 'piece') {
    const items = Object.entries(st.byItem || {}).map(([nm, v]) => [nm + '（' + v.qty + '）', money(v.pay)]);
    return items.concat([['扣款', '-' + money(st.dedTotal)], ['补贴', money(st.alwTotal)]]);
  }
  return [
    ['点工（' + st.units + ' 个工）', money(st.dayPay)],
    ['小时工（' + st.hours + ' 小时）', money(st.hourPay)],
    ['包工（' + st.pkgQty + ' 件）', money(st.pkgPay)],
    ['加班费', money(st.otPay)],
    ['借支', '-' + money(st.borrow)],
    ['已结算', '-' + money(st.settle)]
  ];
}

function payslipImageDataURL() {
  const { kind, cyc, st } = payslipMeta();
  const rows = payslipRows(kind, st);
  const W = 760, padX = 44, lineH = 46;
  const headH = 190, footH = 150;
  const H = headH + rows.length * lineH + 90 + footH;
  const cv = document.createElement('canvas');
  const ratio = Math.min(3, (window.devicePixelRatio || 2) * 1.5);
  cv.width = W * ratio;
  cv.height = H * ratio;
  const ctx = cv.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  // 头部
  ctx.fillStyle = '#2567e8';
  ctx.fillRect(0, 0, W, 7);
  ctx.fillStyle = '#23344e';
  ctx.font = '700 30px "PingFang SC","Noto Sans CJK SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(kind === 'site' ? '工地记工结算单' : '工资条', W / 2, 78);
  ctx.fillStyle = '#8794a8';
  ctx.font = '400 15px "PingFang SC",sans-serif';
  ctx.fillText('工时记 · ' + WORKER_META[kind].name + ' · ' + cyc.label, W / 2, 108);
  ctx.strokeStyle = '#2a6bee';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(padX, 132); ctx.lineTo(W - padX, 132); ctx.stroke();
  // 行
  let y = 170;
  ctx.textAlign = 'left';
  rows.forEach((r, i) => {
    ctx.fillStyle = '#4a5d78';
    ctx.font = '400 17px "PingFang SC",sans-serif';
    ctx.fillText(r[0], padX, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#23344e';
    ctx.font = '600 17px "PingFang SC",sans-serif';
    ctx.fillText(r[1], W - padX, y);
    ctx.textAlign = 'left';
    ctx.strokeStyle = '#eef3f9';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padX, y + 13); ctx.lineTo(W - padX, y + 13); ctx.stroke();
    y += lineH;
  });
  // 合计
  y += 26;
  ctx.strokeStyle = '#2a6bee'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(padX, y - 22); ctx.lineTo(W - padX, y - 22); ctx.stroke();
  ctx.fillStyle = '#23344e';
  ctx.font = '700 19px "PingFang SC",sans-serif';
  ctx.fillText(kind === 'site' ? '未结余款' : '实发金额', padX, y + 10);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#2567e8';
  ctx.font = '700 28px "PingFang SC",sans-serif';
  ctx.fillText(money(st.net), W - padX, y + 12);
  ctx.textAlign = 'left';
  y += 66;
  ctx.fillStyle = '#8794a8';
  ctx.font = '400 14px "PingFang SC",sans-serif';
  ctx.fillText('员工签字：＿＿＿＿＿＿', padX, y);
  ctx.textAlign = 'right';
  ctx.fillText('日期：＿＿＿＿', W - padX, y);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#b3bfce';
  ctx.font = '400 11px "PingFang SC",sans-serif';
  ctx.fillText('本单由「工时记」离线生成 · 数据仅存于本机 · ' + APP_VERSION, padX, H - 36);
  return cv.toDataURL('image/png');
}

function savePayslipImage() {
  try {
    const data = payslipImageDataURL();
    const name = `工时记工资条-${todayKey()}.png`;
    if (window.AndroidBridge && typeof window.AndroidBridge.saveBase64 === 'function') {
      window.AndroidBridge.saveBase64(name, data.split(',')[1]);

    }
    const a = document.createElement('a');
    a.href = data;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已保存图片');

    toast('生成图片失败');
  }
}

function cycleLabelFor(day) {
  if (day <= 1) return '1号 - 本月月底';
  return day + '号 - 下月' + (day - 1) + '号';

function openCycleDialog() {
  const cur = state.cycleStartDay || 1;

function setCycle(day) {

/* ==================== 计时器 ==================== */
let timerTick = 0;
function openTimer() {
  const el = $('timerDialog');
  el.innerHTML = `<div class="sheet-inner">
    <div class="grip"></div>
    <div class="sheet-head">
      <div><h2>计时</h2><p>上班点开始，下班点结束</p></div>
      <button class="close-x" type="button" data-action="close-timer" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <div class="about-hero" style="padding-top:6px">
        <div id="timerClock" style="font-size:46px;font-weight:700;letter-spacing:2px;color:var(--blue);font-variant-numeric:tabular-nums">00:00:00</div>
        <p id="timerState" style="font-size:12px;color:var(--muted-2)">没有在计时</p>
      </div>
      <div class="grid2" style="margin-top:8px">
        <button class="btn btn-soft" type="button" data-action="timer-toggle" id="timerToggle">开始</button>
        <button class="btn btn-ghost" type="button" data-action="timer-reset">清零</button>
      </div>
      <button class="btn btn-primary btn-block" type="button" data-action="timer-finish" style="margin-top:10px">结束并记到今天</button>
      <p class="help">结束时会自动按分钟四舍五入，把工时填进「今天」的记录里；不想记可以点清零。</p>
    </div>
  </div>`;
  openSheet(el);
  timerRefresh();
  clearInterval(timerTick);
  timerTick = setInterval(timerRefresh, 1000);
}

function timerElapsed() {
  const t = state.timer;
  if (!t) return 0;
  let ms = num(t.acc, 0, 0, 86400000);
  if (t.start && !t.paused) ms += Date.now() - num(t.start, Date.now(), 0, 1e15);
  return Math.max(0, ms);
}

function timerRefresh() {
  const clk = $('timerClock');
  if (!clk) { clearInterval(timerTick); return; }
  const ms = timerElapsed();
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  clk.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
  const t = state.timer;
  const st = $('timerState');
  if (st) st.textContent = !t ? '没有在计时' : t.paused ? '已暂停' : '正在计时…';
  const btn = $('timerToggle');
  if (btn) btn.textContent = !t ? '开始' : t.paused ? '继续' : '暂停';
}

function timerToggle() {
  const t = state.timer;
  if (!t) {
    state.timer = { start: Date.now(), paused: false, acc: 0 };
  } else if (t.paused) {
    t.start = Date.now(); t.paused = false;
  } else {
    t.acc = timerElapsed(); t.start = 0; t.paused = true;
  }
  persist(true);
  timerRefresh();
}

function timerReset() {
  state.timer = null;
  persist(true);
  timerRefresh();
  toast('已清零');
}

function timerFinish() {
  const ms = timerElapsed();
  state.timer = null;
  persist(true);
  clearInterval(timerTick);
  $('timerDialog').close();
  const mins = Math.round(ms / 60000);
  const hours = Math.round(mins / 6) / 10; // 保留 1 位小数
  if (hours <= 0) { toast('还没计时，先点开始'); return; }
  const k = todayKey();
  if (state.active === 'regular') {
    openEditor(k);
    setTimeout(() => {
      const inp = document.querySelector('#editorBody input[data-field="otHours"]');
      if (inp) { inp.value = String(hours); inp.dispatchEvent(new Event('input', { bubbles: true })); }
      toast('已把 ' + hours + ' 小时填进加班，确认后保存');
    }, 200);
    return;
  }
  if (state.active === 'temp') {
    openEditor(k);
    setTimeout(() => {
      const inp = document.querySelector('#editorBody input[data-field="hours"]');
      if (inp) { inp.value = String(hours); inp.dispatchEvent(new Event('input', { bubbles: true })); }
      toast('已填入 ' + hours + ' 小时，确认后保存');
    }, 200);
    return;
  }
  if (state.active === 'site') {
    openEditor(k);
    setTimeout(() => {
      const btn = document.querySelector('#editorBody [data-action="site-unit"][data-v="hour"]');
      if (btn) btn.click();
      setTimeout(() => {
        const inp = document.querySelector('#editorBody input[data-field="hours"]');
        if (inp) { inp.value = String(hours); inp.dispatchEvent(new Event('input', { bubbles: true })); }
      }, 60);
    }, 200);
    return;
  }
  openEditor(k);
  toast('计件不按小时算，请填件数');
}

/* ---------- 设置字段写入 ---------- */
function curMonthly() {
  const mk = MONTH_KEY(month);
  if (!state.data[state.active].monthly[mk]) {
    state.data[state.active].monthly[mk] = defaultMonthlySeed(state.active);
  }
  return state.data[state.active].monthly[mk];
}

function setSetting(path, raw, isNum) {
  const s = state.data[state.active].settings;
  let v = raw;
  if (isNum) v = raw === '' ? 0 : num(raw, 0, 0, 1e8);
  if (path === 'unit') v = String(raw || '').slice(0, 6);
  if (path === 'defaultShift') v = WORK_SHIFTS.includes(raw) ? raw : '白班';
  s[path] = v;
}

function updateHourlyHint() {
  const el = $('hourlyHint');
  if (!el) return;
  const s = state.data.regular.settings;
  const cyc = cycleRange(month.getFullYear(), month.getMonth());
  if (s.hourlyRate && s.hourlyRate > 0) {
    el.innerHTML = '已自定义为 <b>' + money(s.hourlyRate) + '</b> / 小时。清空可恢复自动计算。';
  } else {
    const days = s.autoDays ? payDaysInCycle(cyc) : s.daysPerMonth;
    el.innerHTML = '自动：底薪 ÷（' + days + ' × ' + s.hoursPerDay + '）= <b>' + money(hourlyRateFor('regular', cyc)) + '</b> / 小时';
  }
}

function onFieldInput(e) {
  const t = e.target;
  if (!t || !t.dataset) return;
  if (t.dataset.set) {
    const isNum = !!t.dataset.num;
    setSetting(t.dataset.set, t.value, isNum);
    persist();
    updateHourlyHint();
    return;
  }
  if (t.dataset.mon) {
    const mon = curMonthly();
    const v = t.value === '' ? 0 : num(t.value, 0, 0, 744);
    mon[t.dataset.mon] = v;
    persist();
    return;
  }
  if (t.dataset.item) {
    const parts = t.dataset.item.split(':');
    const prefix = parts[0], idx = Number(parts[1]), field = parts[2];
    if (prefix === 'deductions' || prefix === 'allowances') {
      const mon = curMonthly();
      const arr = mon[prefix];
      if (!arr[idx]) return;
      if (field === 'name') arr[idx].name = String(t.value).slice(0, 30);
      if (field === 'amount') arr[idx].amount = t.value === '' ? 0 : num(t.value, 0, 0, 1e7);
      persist();
      return;
    }
    if (prefix === 'pieceItems') {
      const s = state.data.piece.settings;
      const arr = s.items;
      if (!arr[idx]) return;
      if (field === 'name') arr[idx].name = String(t.value).slice(0, 20);
      if (field === 'rate') arr[idx].rate = t.value === '' ? 0 : num(t.value, 0, 0, 1e6);
      persist();
    }
  }
}

function closeAllSheets() {
  ['aboutDialog', 'bgDialog', 'payslipDialog', 'timerDialog', 'cycleDialog', 'editor'].forEach(id => {
    const el = $(id);
    if (el && el.open) el.close();
