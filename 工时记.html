<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2567e8">
<meta name="color-scheme" content="light">
<title>工时记 · 记工时，算工资</title>
<style>
/* ================= 基础 ================= */
:root{
  --blue:#2567e8;--blue-2:#4b8cff;--blue-deep:#1c53c4;--pale:#edf4ff;--pale-2:#f3f8ff;
  --ink:#23344e;--ink-2:#33465f;--muted:#8794a8;--muted-2:#9aa6b8;--line:#eaf0f6;
  --bg:#f5f7fb;--white:#fff;--orange:#d97b1f;--orange-pale:#fff4e5;--red:#e0533d;--red-pale:#fdecea;
  --green:#189a63;--green-pale:#e7f7ef;--purple:#7a5cd6;--purple-pale:#f1edff;
  --radius:20px;--shadow:0 6px 24px rgba(32,59,99,.06);--shadow-sm:0 2px 10px rgba(32,59,99,.05);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-attachment:fixed;
}
body.has-bg-image{background-size:cover;background-position:center;background-repeat:no-repeat}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #a9c9ff;outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:600}
svg{width:20px;height:20px;flex-shrink:0;display:block}
b,strong{font-weight:650}
small{font-size:11px}
::selection{background:#cfe0ff}

/* ================= 布局 ================= */
.app{max-width:760px;margin:0 auto;padding:0 14px calc(84px + var(--safe-b));min-height:100vh;min-height:100dvh}
main{display:block;padding-top:2px}

/* ================= 顶栏 ================= */
.topbar{
  position:sticky;top:0;z-index:30;margin:0 -14px;padding:calc(8px + var(--safe-t)) 14px 0;
  background:rgba(247,249,252,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s;
}
.topbar.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 18px rgba(35,52,78,.05)}
.top-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:52px}
.top-left{display:flex;justify-content:flex-start}
.top-right{display:flex;justify-content:flex-end;gap:6px}

/* 左上角「工」字按钮（保持工字，但明显是按钮） */
.mark-btn{
  width:44px;height:44px;border-radius:14px;color:#fff;font-size:22px;font-weight:700;line-height:1;
  background:linear-gradient(145deg,#3f83ff,#1d55cf);
  box-shadow:0 6px 16px rgba(37,103,232,.32),inset 0 1px 0 rgba(255,255,255,.35);
  display:grid;place-items:center;font-family:"PingFang SC","Noto Sans CJK SC",serif;
  transition:transform .12s ease,box-shadow .12s ease;position:relative;
}
.mark-btn::after{content:"";position:absolute;inset:-4px;border-radius:18px;border:1px solid rgba(37,103,232,.18)}
.mark-btn:active{transform:scale(.94);box-shadow:0 3px 8px rgba(37,103,232,.3)}

/* 标题组：整组水平居中 */
.brand{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.brand h1{font-size:20px;font-weight:700;letter-spacing:2px;line-height:1.1;white-space:nowrap}
.brand .sub{display:none}
.bg-btn{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  color:var(--blue);background:var(--pale);border:1px solid #dbe8ff;
  transition:transform .12s,background .15s;
}
.bg-btn:active{transform:scale(.92);background:#e2edff}
.bg-btn svg{width:17px;height:17px}

.cycle-btn{
  display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:11px;
  background:var(--white);border:1px solid #e2e9f3;color:var(--ink-2);font-size:12px;font-weight:600;
  box-shadow:var(--shadow-sm);white-space:nowrap;
}
.cycle-btn.on{background:var(--pale);border-color:#cfe0ff;color:var(--blue)}
.cycle-btn:active{transform:scale(.97)}

/* 工种切换条 */
.worker-bar{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.worker-switch{
  display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:1;
  background:#e9eef6;border-radius:13px;padding:3px;min-width:0;
}
.worker-switch button{
  display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border-radius:10px;
  font-size:12px;font-weight:600;color:#78869b;white-space:nowrap;transition:background .16s,color .16s,box-shadow .16s;
  min-width:0;
}
.worker-switch button .ico{width:13px;height:13px;opacity:.85;flex-shrink:0}
.worker-switch button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(35,66,106,.12)}
.worker-switch button:active{transform:scale(.97)}

/* ================= 底部导航 ================= */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:7px 10px calc(7px + var(--safe-b));margin:0 auto;max-width:760px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid #edf1f7;box-shadow:0 -6px 20px rgba(35,52,78,.04);
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:5px 4px;border-radius:12px;color:#8b98ac;font-size:10.5px;font-weight:600;transition:color .15s;
}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--blue)}
.nav button.on svg{transform:translateY(-1px)}
.nav button:active{background:#f2f6fd}

/* ================= 通用组件 ================= */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{display:flex;align-items:center;gap:7px}
.card-head .hint{font-size:11px;color:var(--muted-2);font-weight:400}
.section-title{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.5px;margin:18px 2px 10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;
  border-radius:13px;font-size:14px;font-weight:650;white-space:nowrap;transition:transform .12s,filter .15s;
}
.btn:active{transform:scale(.975);filter:brightness(.97)}
.btn-primary{background:linear-gradient(135deg,#3b7bfa,#1d55cf);color:#fff;box-shadow:0 6px 16px rgba(37,103,232,.28)}
.btn-soft{background:var(--pale);color:var(--blue);border:1px solid #d7e5ff}
.btn-ghost{background:#f4f7fb;color:var(--ink-2);border:1px solid #e6edf6}
.btn-danger{background:var(--red-pale);color:var(--red);border:1px solid #f8d3cd}
.btn-block{display:flex;width:100%}
.btn-sm{height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.btn-icon{width:38px;height:38px;padding:0;border-radius:12px}

.segmented{display:grid;gap:3px;background:#eef2f8;border-radius:13px;padding:3px}
.segmented button{padding:9px 6px;border-radius:10px;font-size:13px;font-weight:600;color:#7c8aa0;transition:background .15s,color .15s}
.segmented button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(35,66,106,.1)}

.field{display:block;margin-top:14px}
.field:first-child{margin-top:0}
.field > span,.field-title{display:block;font-size:12px;color:#6f7e94;margin-bottom:7px;font-weight:550}
.input-unit{
  display:flex;align-items:center;gap:6px;background:#f8fafd;border:1px solid #e5ecf5;border-radius:11px;
  padding:0 12px;height:44px;transition:border-color .15s,box-shadow .15s;
}
.input-unit:focus-within{border-color:#9dc0ff;box-shadow:0 0 0 3px rgba(37,103,232,.1);background:#fff}
.input-unit input{
  flex:1;min-width:0;border:0;background:none;outline:none;height:100%;font-size:15px;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
.input-unit input::placeholder{color:#b7c2d2;font-size:13px}
.input-unit .unit{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.input-unit .mini-btn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#eef3fb;color:var(--blue);font-size:15px;flex-shrink:0}

.help{font-size:11.5px;line-height:1.65;color:var(--muted);margin-top:8px}
.help b{color:var(--ink-2)}
.muted{color:var(--muted-2)}
.small{font-size:11px}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row-line:last-child{border-bottom:0}
.row-line .r{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.row-line.total{border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:14px;font-size:15px}
.row-line.total .r{color:var(--blue);font-size:21px;font-weight:700}
.row-line .neg{color:var(--red)}
.row-line .pos{color:var(--green)}
.sub-line{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11px;color:var(--muted);padding:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;background:#f4f7fb;font-size:11.5px;color:#4a5d78}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#b9c3d1}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.empty{text-align:center;color:var(--muted-2);font-size:12.5px;padding:22px 10px;line-height:1.8}
.empty .big{font-size:28px;display:block;margin-bottom:6px;opacity:.5}
/* ================= 日历页 ================= */
.monthbar{display:flex;align-items:center;gap:6px;padding:10px 2px 12px}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
  background:var(--white);border:1px solid #e4ebf5;color:#5f7189;font-size:20px;line-height:1;
  box-shadow:var(--shadow-sm);font-family:"PingFang SC",sans-serif;
}
.iconbtn:active{background:#f1f6ff;color:var(--blue)}
.iconbtn svg{width:18px;height:18px}
.month-title{flex:1;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.month-title strong{font-size:18px;font-weight:700;letter-spacing:.4px;line-height:1.25}
.month-title .eyebrow{font-size:10.5px;color:var(--muted-2);letter-spacing:.3px}
.month-title .tap-hint{font-size:9.5px;color:#b3bfce}

/* 蓝色汇总横幅 */
.summary{
  position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:16px 18px;border-radius:22px;color:#fff;
  background:linear-gradient(132deg,#4b8cff 0%,#2a6bee 46%,#1b4fc0 100%);
  box-shadow:0 12px 26px rgba(37,103,232,.28),inset 0 1px 0 rgba(255,255,255,.22);
}
.summary::before{content:"";position:absolute;right:-46px;top:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.summary::after{content:"";position:absolute;right:24px;bottom:-96px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.summary .s-main{position:relative;z-index:1;min-width:0}
.summary .s-label{font-size:11.5px;color:#cfe0ff;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.summary .s-label .tag{background:rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:1px 6px;font-size:9.5px;font-weight:600}
.summary .s-money{font-size:31px;font-weight:700;letter-spacing:.3px;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(10,40,110,.18)}
.summary .s-money.neg{color:#ffd8d1}
.summary .s-note{font-size:10.5px;color:#c9dcff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .s-stats{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;text-align:right;font-size:11.5px;color:#d5e4ff;white-space:nowrap}
.summary .s-stats b{color:#fff;font-weight:650}
.summary .s-stats .row{display:flex;justify-content:flex-end;align-items:baseline;gap:4px}
.summary .settle{position:relative;z-index:1;margin-top:6px;display:flex;justify-content:flex-end}

/* 日历卡片 */
.calendar-card{padding:14px 9px 12px;margin-top:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#93a0b3;font-weight:600;padding:0 0 8px;border-bottom:1px solid var(--line);letter-spacing:.5px}
.week .we{color:#6f9df0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;padding-top:9px}
.day{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;
  min-height:64px;padding:5px 1px 4px;border-radius:12px;border:1px solid transparent;background:transparent;
  transition:background .12s,transform .1s;
}
.day:active{background:#eef4ff}
.day .dnum{font-size:17px;font-weight:650;line-height:23px;color:#33465f;font-variant-numeric:tabular-nums}
.day.weekend .dnum{color:#5b8def}
.day.holiday .dnum{color:#e0533d}
.day.outside{opacity:.24;pointer-events:none}
.day.is-today{background:#e9f2ff;border-color:#4b8cff;box-shadow:inset 0 0 0 1.5px #4b8cff}
.day.is-today .dnum{color:#1d55cf;font-weight:700}
.day.is-today .rest-tag{background:#dbe9ff;color:#1d55cf}
.day.has{background:#f6faff}
.day .lunar{font-size:8.5px;color:#aab6c6;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px}
.day.holiday .lunar{color:#e8a99e}
.day .lunar.lf{color:#c08a3e}
.day .d-wage{font-size:9px;color:var(--blue);font-weight:650;line-height:1.25;white-space:nowrap;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.day .d-wage.neg{color:var(--red)}
.day .d-qty{font-size:8.5px;color:var(--purple);line-height:1.2;font-weight:600;white-space:nowrap}
.day .d-miss{font-size:8px;color:#d9822a;background:#fff3e3;border-radius:4px;padding:0 3px;line-height:1.5}
/* 「休」字角标 */
.day .rest-tag{
  position:absolute;top:3px;right:3px;font-size:8px;line-height:1.45;padding:0 3px;border-radius:4px;
  background:#f0f4f9;color:#9aa6b8;font-weight:600;
}
.day.holiday .rest-tag{background:var(--red-pale);color:var(--red)}
.day.weekend .rest-tag{background:#e9f1ff;color:#5b8def}
/* 当天有记录时的角点 */
.day.has::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#c9dbff}
.cal-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 4px 0;margin-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:#93a0b3}
.cal-foot .lg{display:inline-flex;align-items:center;gap:5px}
.cal-foot .dot{margin-right:1px}

/* 记工大按钮（参考图底部） */
.cal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.cal-actions .btn{height:48px;font-size:15px;border-radius:14px}

/* 漏记提示条 */
.reminder{
  display:flex;align-items:center;gap:9px;margin-top:12px;padding:11px 14px;border-radius:13px;
  background:var(--orange-pale);color:#a15c00;font-size:12px;line-height:1.5;
}
.reminder svg{color:#d9822a;width:17px;height:17px}
.reminder .go{margin-left:auto;color:#b8720e;font-weight:650;font-size:11.5px;border:1px solid #ffd9a8;background:#fff;border-radius:8px;padding:3px 9px;white-space:nowrap}
/* ================= 明细页 ================= */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 2px 12px}
.page-head .ph-main{min-width:0}
.page-head h2{font-size:20px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.page-head .ph-sub{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.page-head .ph-act{display:flex;gap:7px;flex-shrink:0}

.settle-card{padding:18px 18px 16px}
.settle-card .sc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.settle-card .sc-title{font-size:13px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.settle-card .sc-title .ico{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;background:var(--pale);color:var(--blue)}
.sc-badge{font-size:10px;padding:2px 7px;border-radius:7px;background:var(--green-pale);color:var(--green);font-weight:650}
.sc-badge.warn{background:var(--orange-pale);color:var(--orange)}

.money-hero{display:flex;align-items:baseline;gap:8px;margin:4px 0 12px}
.money-hero .amt{font-size:34px;font-weight:700;letter-spacing:.2px;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.15}
.money-hero .amt.neg{color:var(--red)}
.money-hero .unit{font-size:12px;color:var(--muted-2)}
.money-hero .delta{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;line-height:1.4}

.line-items{border-top:1px solid var(--line);margin-top:4px}
.li-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #eff3f9;font-size:13px;color:#4a5d78}
.li-row:last-child{border-bottom:0}
.li-row .li-name{display:flex;align-items:center;gap:6px;min-width:0}
.li-row .li-name .em{font-style:normal;font-size:9px;padding:1px 5px;border-radius:5px;background:var(--orange-pale);color:var(--orange);white-space:nowrap}
.li-row .li-val{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}
.li-row .li-val.neg{color:var(--red)}
.li-row .li-val.pos{color:var(--green)}
.li-row.total{font-size:14.5px;font-weight:650;color:var(--ink);border-top:1px solid var(--line);border-bottom:0;margin-top:2px;padding-top:12px}
.li-row.total .li-val{font-size:22px;color:var(--blue);font-weight:700}
.li-sub{font-size:10.5px;color:var(--muted-2);padding:0 0 8px;line-height:1.6}

/* 分类卡片（工地/统计） */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.cat{display:flex;flex-direction:column;gap:2px;padding:12px 13px;border-radius:14px;background:#f8fafd;border:1px solid #eef3f9;text-align:left}
.cat .cat-name{font-size:12px;color:#6f7e94;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cat .cat-val{font-size:19px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.cat .cat-sub{font-size:10.5px;color:var(--muted-2)}
.cat.green .cat-val{color:var(--green)}
.cat.orange .cat-val{color:var(--orange)}
.cat.purple .cat-val{color:var(--purple)}
.cat.full{grid-column:1/-1}

/* 出勤统计 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:11px 8px;text-align:center;border-radius:13px;background:#f8fafd;border:1px solid #eef3f9}
.stat b{display:block;font-size:18px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:10.5px;color:var(--muted-2)}
.stat.blue b{color:var(--blue)}
.stat.orange b{color:var(--orange)}
.stat.purple b{color:var(--purple)}
.stat.green b{color:var(--green)}
.shift-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.shift-pills .pill{font-size:11px;padding:5px 9px}
.pill.sh-white::before{background:#5b8def}
.pill.sh-morning::before{background:#f5a623}
.pill.sh-noon::before{background:#9b6bd6}
.pill.sh-evening::before{background:#3f6fd8}
.pill.sh-night::before{background:#4a4a8a}
.pill.sh-rest::before{background:#b9c3d1}
.pill.sh-leave::before{background:#e0533d}
.pill.sh-sick::before{background:#e8b93a}
.pill.sh-holiday::before{background:#e0533d}

/* 记录列表 */
.rec-list{display:block}
.rec-row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 2px;
  border-bottom:1px solid var(--line);background:transparent;transition:background .12s;
}
.rec-row:last-child{border-bottom:0}
.rec-row:active{background:#f7faff}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;flex-shrink:0;gap:1px}
.datebox b{font-size:18px;line-height:1.15;color:#33465f;font-variant-numeric:tabular-nums}
.datebox small{font-size:9.5px;color:var(--muted-2);white-space:nowrap}
.rec-info{display:flex;flex:1;flex-direction:column;min-width:0;gap:2px;align-items:flex-start}
.rec-info .t{font-size:13px;color:#33465f;display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.rec-info .t .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rec-info .note{font-size:11px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rec-amt{font-size:14.5px;font-weight:650;white-space:nowrap;color:var(--blue);flex-shrink:0;font-variant-numeric:tabular-nums}
.rec-amt.neg{color:var(--red)}
.rec-amt.zero{color:#c2ccdb}
.rec-row.empty-row .rec-info{color:#a8b4c4}
.badge{font-size:9px;padding:1px 5px;border-radius:5px;font-weight:600;white-space:nowrap}
.badge.holiday{background:var(--red-pale);color:var(--red)}
.badge.weekend{background:#eaf1ff;color:#5b8def}
.badge.rest{background:#f0f4f9;color:#9aa6b8}
.badge.piece{background:var(--purple-pale);color:var(--purple)}
.badge.site{background:var(--green-pale);color:var(--green)}
.badge.borrow{background:var(--orange-pale);color:var(--orange)}

/* 年度 */
.year-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.year-row .y{font-size:11px;color:var(--muted-2)}
.year-row .v{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.year-bars{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:12px}
.year-bars .bar{flex:1;background:#e8f0ff;border-radius:4px 4px 2px 2px;min-height:3px;position:relative}
.year-bars .bar.on{background:linear-gradient(180deg,#6ea3ff,#2a6bee)}
.year-bars .bar.cur{background:linear-gradient(180deg,#3b7bfa,#1b4fc0)}
.year-labels{display:flex;gap:3px;margin-top:4px}
.year-labels span{flex:1;text-align:center;font-size:8.5px;color:var(--muted-2);letter-spacing:-.3px}
.year-labels span.cur{color:var(--blue);font-weight:700}
/* ================= 设置页 ================= */
.set-card{padding:17px 16px}
.set-card .sc-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.set-card .sc-head .ico{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--pale);color:var(--blue);font-size:15px}
.set-card .sc-head h2{font-size:15px;font-weight:650;line-height:1.3}
.set-card .sc-head .sub{font-size:10.5px;color:var(--muted-2);font-weight:400;margin-top:1px}
.set-card .sc-body{margin-top:10px}
.set-card.off{opacity:.55}
.set-card.off .sc-head .ico{background:#eef2f8;color:#9aa6b8}

/* 开关 */
.switch{position:relative;width:46px;height:27px;border-radius:99px;background:#dbe3ed;flex-shrink:0;transition:background .18s;border:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(20,40,70,.25);transition:transform .18s}
.switch.on{background:var(--blue)}
.switch.on::after{transform:translateX(19px)}

.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row .sw-txt{min-width:0}
.switch-row .sw-txt b{display:block;font-size:13.5px;font-weight:550;color:var(--ink-2)}
.switch-row .sw-txt small{display:block;font-size:10.5px;color:var(--muted-2);margin-top:1px;line-height:1.5}

/* 工作日选择 */
.week-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:9px}
.wd{height:42px;border-radius:11px;background:#f5f8fc;border:1px solid #e6edf6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:#7c8aa0;font-weight:600}
.wd small{font-size:8.5px;color:#b3bfce;font-weight:400}
.wd.on{background:linear-gradient(135deg,#3b7bfa,#1d55cf);border-color:#2a6bee;color:#fff;box-shadow:0 4px 10px rgba(37,103,232,.22)}
.wd.on small{color:#d5e4ff}
.wd:active{transform:scale(.96)}
.preset-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.preset-chip{padding:6px 11px;border-radius:9px;background:#f2f6fc;border:1px solid #e4ebf5;color:#5f7189;font-size:11.5px;font-weight:550}
.preset-chip.on{background:var(--pale);border-color:#bcd6ff;color:var(--blue)}
.preset-chip:active{transform:scale(.97)}

/* 设置操作行 */
.set-action{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);background:transparent}
.set-action:last-child{border-bottom:0}
.set-action b{display:block;font-size:13.5px;font-weight:550;color:var(--ink-2)}
.set-action small{display:block;font-size:10.5px;color:var(--muted-2);margin-top:1px;line-height:1.5}
.set-action .chev{color:#c2ccdb;font-size:19px;flex-shrink:0;display:flex;align-items:center}
.set-action .chev svg{width:16px;height:16px}
.set-action:active b{color:var(--blue)}
.set-action.danger b{color:var(--red)}

/* 计件单价表 */
.rate-row{display:grid;grid-template-columns:1fr 94px 34px;gap:7px;align-items:center;margin-bottom:7px}
.rate-row .input-unit{height:40px;padding:0 10px}
.rate-row .input-unit input{font-size:13.5px}
.rate-del{width:34px;height:34px;border-radius:10px;background:var(--red-pale);color:var(--red);font-size:17px;line-height:1;display:grid;place-items:center}
.rate-del:active{transform:scale(.94)}

/* 背景选择 */
.bg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.bg-opt{position:relative;aspect-ratio:9/14;border-radius:13px;border:2px solid transparent;overflow:hidden;background:#eef2f8;box-shadow:var(--shadow-sm)}
.bg-opt.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,103,232,.15)}
.bg-opt .sw{position:absolute;inset:0}
.bg-opt .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 4px 4px;font-size:9.5px;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.42));font-weight:550}
.bg-opt .ck{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:10px;line-height:1}
.bg-opt.on .ck{display:grid}
.bg-upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px dashed #cdd9e8;background:#fafcff;color:var(--muted)}
.bg-upload .plus{font-size:20px;line-height:1;color:#a8b7cb}
.bg-upload span{font-size:9.5px}
.bg-bar{display:flex;align-items:center;gap:9px;margin-top:12px}
.bg-preview{flex:1;height:40px;border-radius:11px;background:#f5f7fb;border:1px solid #e6edf6;overflow:hidden;position:relative}
.bg-preview i{position:absolute;inset:0;display:block}
.bg-preview em{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:#5f7189;background:rgba(255,255,255,.75);padding:2px 7px;border-radius:6px}
.bg-slider{display:flex;align-items:center;gap:9px;margin-top:12px}
.bg-slider input[type=range]{flex:1;-webkit-appearance:none;height:26px;background:transparent}
.bg-slider input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:#e3ebf6}
.bg-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid var(--blue);margin-top:-6.5px;box-shadow:0 2px 6px rgba(37,103,232,.3)}
.bg-slider span{font-size:11px;color:var(--muted-2);white-space:nowrap}

/* 工种说明 */
.mode-note{display:flex;gap:8px;padding:10px 12px;border-radius:11px;background:var(--pale-2);border:1px solid #e4eeff;font-size:11.5px;color:#4a6080;line-height:1.6;margin-top:10px}
.mode-note b{color:var(--blue)}

/* 版本与信息 */
.info-list{display:grid;gap:7px;font-size:12px;color:#5f7189;margin-top:8px}
.info-list .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #eef3f9}
.info-list .kv:last-child{border-bottom:0}
.info-list .kv b{font-weight:600;color:var(--ink-2)}
.footer-note{text-align:center;font-size:10.5px;color:#a8b4c4;margin:20px 0 8px;line-height:1.8}
/* ================= 弹窗 / 编辑器 ================= */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(22,36,60,.42);backdrop-filter:blur(2px)}
dialog.sheet{
  width:100%;max-width:760px;margin:0 auto;inset:auto 0 0;max-height:93vh;max-height:93dvh;
  border-radius:24px 24px 0 0;background:var(--white);box-shadow:0 -10px 40px rgba(20,40,70,.18);
  overflow:hidden;
}
dialog.sheet[open]{animation:sheetUp .22s cubic-bezier(.22,.61,.36,1)}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-inner{display:flex;flex-direction:column;max-height:93vh;max-height:93dvh}
.grip{width:36px;height:4px;border-radius:99px;background:#dfe6ef;margin:9px auto 0;flex-shrink:0}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 20px 8px;flex-shrink:0}
.sheet-head h2{font-size:18px;font-weight:700;letter-spacing:.2px}
.sheet-head p{font-size:11px;color:var(--muted-2);margin-top:2px}
.sheet-body{padding:4px 20px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.sheet-foot{padding:12px 20px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:8px;flex-shrink:0;border-top:1px solid var(--line);background:var(--white)}
.sheet-foot.row{flex-direction:row}
.sheet-foot.row .btn{flex:1}
.close-x{width:34px;height:34px;border-radius:10px;background:#f3f6fb;color:#7c8aa0;font-size:18px;display:grid;place-items:center;flex-shrink:0;line-height:1}
.close-x:active{background:#e9eef7}

/* 编辑器分段 */
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;background:#eef2f8;border-radius:12px;padding:3px;margin:2px 0 4px}
.tabs button{padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:#7c8aa0}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(35,66,106,.1)}
.tabs.three{grid-template-columns:repeat(3,1fr)}

.ed-mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.ed-mode .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:8px;background:var(--pale);color:var(--blue)}
.ed-mode .tag.temp{background:var(--orange-pale);color:var(--orange)}
.ed-mode .tag.piece{background:var(--purple-pale);color:var(--purple)}
.ed-mode .tag.site{background:var(--green-pale);color:var(--green)}
.ed-dayinfo{font-size:11px;color:var(--muted-2)}
.ed-dayinfo .badge{margin-left:5px}

.quick-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.qbtn{
  padding:8px 12px;border-radius:10px;background:#f4f7fc;border:1px solid #e7eef7;color:#5f7189;
  font-size:12px;font-weight:650;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
}
.qbtn.on{background:var(--pale);border-color:#bcd6ff;color:var(--blue)}
.qbtn .n{font-size:9px;color:#a8b4c4}
.qbtn:active{transform:scale(.96)}
.qbtn.danger.on{background:var(--red-pale);border-color:#f8d3cd;color:var(--red)}

.shifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;margin-top:8px}
.shift-btn{padding:9px 3px;border-radius:10px;background:#f5f8fc;border:1px solid #e7eef7;font-size:12px;color:#5f7188;font-weight:550;display:flex;align-items:center;justify-content:center;gap:5px}
.shift-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650;box-shadow:0 4px 12px rgba(37,103,232,.25)}
.shift-btn .dot{background:#b9c3d1}
.shift-btn.on .dot{background:#fff}

.ed-calcs{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:11px;background:#f7faff;border:1px solid #e6efff;font-size:11.5px;color:#5a7194;line-height:1.5;margin-top:10px}
.ed-calcs b{color:var(--blue);font-variant-numeric:tabular-nums}

/* 计件明细行 */
.piece-row{display:grid;grid-template-columns:1fr 74px 88px 34px;gap:6px;align-items:center;margin-bottom:7px}
.piece-row .input-unit{height:40px;padding:0 9px}
.piece-row .input-unit input{font-size:13px}
.piece-row .amount{font-size:12.5px;font-weight:650;color:var(--purple);text-align:right;font-variant-numeric:tabular-nums;padding-right:2px}
.piece-more{display:flex;align-items:center;gap:6px}
.add-piece{margin-top:2px;padding:8px 0;color:var(--blue);font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:4px}
.piece-total{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 2px;font-size:13px;color:#5f7189;border-top:1px dashed #eaf0f7;margin-top:6px}
.piece-total b{font-size:17px;color:var(--purple)}

/* 工地记工 */
.site-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.site-seg button{padding:10px 4px;border-radius:11px;background:#f5f8fc;border:1px solid #e7eef7;font-size:12.5px;color:#5f7189;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px}
.site-seg button small{font-size:9.5px;color:#a8b4c4;font-weight:400}
.site-seg button.on{background:var(--green-pale);border-color:#b9e6d0;color:var(--green)}
.site-seg button.on small{color:#4c9c78}

/* 关于弹窗 */
.about-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 14px;text-align:center}
.about-hero .logo{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;color:#fff;font-size:27px;font-weight:700;background:linear-gradient(145deg,#3f83ff,#1d55cf);box-shadow:0 10px 24px rgba(37,103,232,.3);font-family:"PingFang SC",serif}
.about-hero h2{font-size:19px;letter-spacing:1px}
.about-hero p{font-size:11px;color:var(--muted-2)}
.about-text{font-size:12.5px;line-height:1.9;color:#4a5d78;white-space:pre-wrap;word-break:break-word}
.about-text .k{color:var(--blue);font-weight:650}
.about-block{margin-top:14px;border-radius:13px;background:#f8fafd;border:1px solid #eaf0f7;overflow:hidden}
.about-block .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #eef3f9}
.about-block .bh b{font-size:12.5px;color:var(--ink-2)}
.about-block pre{margin:0;padding:11px 12px;font:11px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#4a5d78;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:auto;background:#fbfdff}
.copy-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:8px;background:#fff;border:1px solid #dbe8ff;color:var(--blue);font-size:11px;font-weight:650}
.copy-btn:active{transform:scale(.96);background:var(--pale)}
.copy-btn.done{background:var(--green-pale);border-color:#b9e6d0;color:var(--green)}

/* 工资条 */
.payslip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:12.5px}
.payslip .ps-head{text-align:center;padding-bottom:10px;border-bottom:2px solid #2a6bee}
.payslip .ps-head h3{font-size:16px;letter-spacing:2px;color:var(--ink)}
.payslip .ps-head p{font-size:10.5px;color:var(--muted-2);margin-top:2px}
.payslip .ps-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:10px 0;font-size:11.5px;color:#5f7189;border-bottom:1px dashed #e4ebf4}
.payslip .ps-meta b{color:var(--ink-2);font-weight:600}
.payslip table{width:100%;border-collapse:collapse;margin-top:6px}
.payslip td{padding:6px 2px;border-bottom:1px dashed #eef3f9;font-size:12px;color:#4a5d78}
.payslip td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);white-space:nowrap}
.payslip tr.total td{border-top:1.5px solid #2a6bee;border-bottom:0;padding-top:9px;font-weight:700;color:var(--ink);font-size:13.5px}
.payslip tr.total td:last-child{color:var(--blue);font-size:20px}
.payslip .ps-foot{display:flex;justify-content:space-between;gap:10px;padding-top:14px;font-size:10.5px;color:var(--muted-2)}
.payslip .ps-sign{margin-top:16px;padding-top:10px;border-top:1px dashed #e4ebf4;display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted-2)}


/* toast / confirm */
.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(10px);
  z-index:200;background:rgba(30,44,66,.94);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;
  box-shadow:0 8px 24px rgba(20,40,70,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:78vw;text-align:center;line-height:1.5;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog.confirm{width:calc(100% - 56px);max-width:340px;margin:auto;border-radius:18px;background:#fff;padding:20px 18px 14px;box-shadow:0 20px 50px rgba(20,40,70,.25)}
dialog.confirm h2{font-size:16px;text-align:center;margin-bottom:8px}
dialog.confirm p{font-size:12.5px;color:#5f7189;text-align:center;line-height:1.7;white-space:pre-wrap}
dialog.confirm .c-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
dialog.confirm .c-btns .btn{height:42px;font-size:14px}

/* 打印 */
.print-area{display:none}
@media print{
  body{background:#fff!important}
  .app,.nav,.topbar,.keypad,.toast,dialog,#toast{display:none!important}
  .print-area{display:block!important;padding:0}
  .print-area .payslip{border:0;padding:0;max-width:100%}
  dialog[open] .print-area{display:block!important}
  @page{margin:12mm}
}

/* 响应式 */
@media (max-width:360px){
  .app{padding-left:10px;padding-right:10px}
  .brand h1{font-size:18px;letter-spacing:1px}
  .worker-switch button{font-size:11px;padding:8px 1px}
  .worker-switch button .ico{display:none}
  .day{min-height:58px}
  .day .dnum{font-size:15.5px}
  .summary .s-money{font-size:27px}
  .grid3{gap:6px}
  .piece-row{grid-template-columns:1fr 62px 76px 32px}
}
@media (min-width:600px){
  .days{gap:7px 5px}
  .day{min-height:74px}
  .day .dnum{font-size:19px}
  .bg-grid{grid-template-columns:repeat(6,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
/* ================= 补充组件 ================= */
.warning{
  margin:10px 0 0;padding:11px 14px;border-radius:13px;background:#fff4e5;color:#a15c00;
  font-size:12px;line-height:1.6;border:1px solid #ffe2b8;
}
.textbtn{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-size:12.5px;font-weight:650;padding:8px 0}
.textbtn:active{opacity:.7}

.cycle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.cycle-opt{padding:11px 3px;border-radius:11px;background:#f5f8fc;border:1px solid #e8eef7;font-size:12.5px;color:#4a5d78;font-weight:550}
.cycle-opt.on{background:linear-gradient(135deg,#3b7bfa,#1d55cf);color:#fff;border-color:#2a6bee;font-weight:650;box-shadow:0 5px 14px rgba(37,103,232,.22)}
.cycle-opt:active{transform:scale(.97)}

/* 工资周期小按钮（日历横幅） */
.settle-mini{
  position:relative;z-index:1;margin-left:8px;display:inline-flex;align-items:center;gap:4px;
  height:22px;padding:0 8px;border-radius:7px;font-size:10px;font-weight:600;
  background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35);white-space:nowrap;
}
.settle-mini.on{background:#fff;color:#1d55cf;border-color:#fff}

/* ================= 壁纸层 =================
   用独立的固定图层画壁纸，不再用 body 的 background-attachment:fixed
   （安卓 WebView 对 fixed 背景支持很差，滚动时会丢图，这就是「看不到壁纸」的原因） */
.wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);transition:background .25s}
.wall-img{
  position:absolute;inset:-6%;background-position:center;background-repeat:no-repeat;background-size:cover;
  opacity:0;transition:opacity .35s ease, filter .2s ease;will-change:opacity,filter;
}
body.has-bg-image .wall-img{opacity:1}
.wall-scrim{position:absolute;inset:0;background:#0a1422;opacity:0;transition:opacity .2s}
.app{position:relative;z-index:1}

/* 壁纸模式下：卡片 / 日历格 / 各种面板跟着「卡片透明度」一起变透 */
body.bg-custom .card,
body.bg-custom .day,
body.bg-custom .cat,
body.bg-custom .stat,
body.bg-custom .cycle-btn,
body.bg-custom .iconbtn,
body.bg-custom .preset-chip,
body.bg-custom .wd,
body.bg-custom .bg-preview,
body.bg-custom .worker-switch,
body.bg-custom .worker-switch button.on,
body.bg-custom .tabs button.on{background:rgba(255,255,255,var(--surf-a,1))}
body.bg-custom .day.has{background:rgba(246,250,255,var(--surf-a,1))}
body.bg-custom .day.is-today{background:rgba(233,242,255,var(--surf-a,1))}
body.bg-custom .worker-switch{background:rgba(233,238,246,var(--surf-a2,1))}
body.bg-custom .topbar{background:rgba(247,249,252,var(--surf-a2,1))}
body.bg-custom .nav{background:rgba(255,255,255,var(--surf-a2,1))}
body.bg-custom .summary{box-shadow:0 12px 26px rgba(37,103,232,.32)}
body.bg-custom dialog.sheet{background:rgba(255,255,255,.97)}
/* 仅用户主动开启「卡片毛玻璃」时模糊壁纸；默认保持壁纸清晰 */
body.bg-glass .card,
body.bg-glass .day,
body.bg-glass .worker-switch,
body.bg-glass .topbar,
body.bg-glass .nav,
body.bg-glass .monthbar,
body.bg-glass .page-head,
body.bg-glass .cat,
body.bg-glass .stat{backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}

/* 壁纸设置面板 */
.bg-preview-tall{position:relative;height:132px;border-radius:14px;overflow:hidden;border:1px solid #e6edf6;margin:12px 0 4px;background:#f5f7fb}
.bg-preview-tall .bp-wall{position:absolute;inset:0;background-position:center;background-size:cover}
.bg-preview-tall .bp-scrim{position:absolute;inset:0;background:#0a1422;opacity:0}
.bg-preview-tall .bp-card{position:absolute;left:12px;right:12px;top:34px;height:64px;border-radius:13px;background:#fff;box-shadow:0 6px 18px rgba(20,40,70,.14);padding:10px 12px}
.bg-preview-tall .bp-card b{display:block;font-size:13px;color:#23344e}
.bg-preview-tall .bp-card span{font-size:11px;color:#8794a8}
.bg-preview-tall .bp-tag{position:absolute;left:8px;top:8px;font-size:9.5px;color:#fff;background:rgba(10,20,34,.45);padding:2px 7px;border-radius:6px}
.bg-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef2f8;border-radius:11px;padding:3px;margin-top:6px}
.bg-seg button{height:32px;border-radius:9px;font-size:12px;font-weight:600;color:#6f7e94}
.bg-seg button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(35,66,106,.1)}

/* 卡片内标题小图标 */
.card-head h2 .ico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--pale);color:var(--blue);margin-right:2px}
.card-head h2 .ico svg{width:14px;height:14px}
.set-card .sc-head .ico svg{width:17px;height:17px}
.set-card .sc-head .ico{font-size:15px}

/* 弹窗里的复选框行 */
.mini-check{display:flex;align-items:center;gap:7px;font-size:12px;color:#5f7189;padding:6px 0}
.mini-check input{width:17px;height:17px;accent-color:var(--blue)}

/* ================= 网格/输入框防溢出（重要） ================= */
.field{min-width:0}
.grid2,.grid3,.week-picker,.item-row,.rate-row{min-width:0}
.grid2 > *,.grid3 > *{min-width:0}
.input-unit{min-width:0;width:100%}
.input-unit input{width:100%;min-width:0}
.grid2 .field,.grid3 .field{min-width:0}
.field > .input-unit{margin-top:0}
.week-picker .wd{min-width:0;overflow:hidden}
.week-picker .wd small{font-size:8px;line-height:1.1}
.card,.set-card,.sc-body{min-width:0}
.brand h1{max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.grid2,.grid3{margin-top:12px}
.field + .help{margin-top:6px}

/* 键盘打开时，弹窗内容整体上移，避免挡住底部按钮 */


/* 工资周期滚轮 */
.wheel-wrap{position:relative;height:264px;margin:14px 0 6px;border-radius:15px;overflow:hidden;background:#f7fafd;border:1px solid #e8eef7}
.wheel{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wheel::-webkit-scrollbar{display:none}
.wheel-pad{height:110px;flex-shrink:0}
.wheel-item{display:flex;align-items:center;justify-content:center;width:100%;height:44px;scroll-snap-align:center;font-size:14px;color:#93a0b3;background:none;border:0;font-variant-numeric:tabular-nums;transition:color .15s,font-size .15s}
.wheel-item.on{color:var(--blue);font-weight:700;font-size:16.5px}
.wheel-mid{position:absolute;left:14px;right:14px;top:110px;height:44px;border-top:1px solid #d6e4fb;border-bottom:1px solid #d6e4fb;background:rgba(37,103,232,.045);border-radius:8px;pointer-events:none;z-index:1}



/* 壁纸面板：预览 / 按钮 / 滑块 / 配色条 */
.bg-actions{display:flex;gap:8px;margin-top:10px}
.bg-actions .btn{flex:1;height:40px}
.bg-slider-row{margin-top:8px}
.bg-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.bg-strip::-webkit-scrollbar{display:none}
.bg-strip .bg-opt{flex:0 0 58px;width:58px;height:76px;aspect-ratio:auto}
.bg-strip .bg-opt .nm{font-size:8.5px;padding:8px 2px 3px}
.bg-preview-tall{height:124px}
body.bg-custom .monthbar{background:rgba(255,255,255,var(--surf-a2,1));border-radius:18px;padding:10px 4px 11px;margin-bottom:4px;box-shadow:var(--shadow-sm)}

/* 文字多的页面（明细/设置）用更实的底，保证看得清 */
body.bg-custom #main .card:not(.calendar-card){background:rgba(255,255,255,var(--surf-b,1))}
body.bg-custom .page-head{background:rgba(255,255,255,var(--surf-a2,1));border-radius:16px;padding:12px 13px 11px;margin:0 0 4px;box-shadow:var(--shadow-sm)}
body.bg-custom .settle-card .sc-rows,
body.bg-custom .settle-card .sc-total{border-color:rgba(210,224,240,.85)}

/* ================= 加班倍率拆分（公司对调倍率时用） ================= */
.ot-split{margin-top:6px}
.ot-split-body{
  margin-top:8px;padding:12px 12px 10px;border-radius:13px;
  background:#f5f8fc;border:1px solid #e8eef7;
}
.ot-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ot-row:last-of-type{margin-bottom:0}
.ot-name{flex:0 0 76px;font-size:12.5px;color:var(--ink-2);font-weight:600;line-height:1.3}
.ot-name em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.ot-row .input-unit{flex:1}
.ot-total{margin-top:10px;font-size:12px;color:var(--muted);text-align:right;line-height:1.6}
.ot-total b{font-weight:650}
.ot-total b.pos{color:var(--green)}
.ot-total b.neg{color:var(--red)}
</style>
</head>
<body>
<div class="wallpaper" id="wallpaper" aria-hidden="true">
  <div class="wall-img" id="wallImg"></div>
  <div class="wall-scrim" id="wallScrim"></div>
</div>
<div class="app">
  <header class="topbar" id="topbar">
    <div class="top-grid">
      <div class="top-left">
        <button class="mark-btn" id="aboutBtn" type="button" data-action="about" aria-label="关于工时记">工</button>
      </div>
      <div class="brand">
        <h1>工时记</h1>
        <button class="bg-btn" id="bgBtn" type="button" data-action="open-bg" aria-label="自定义背景" title="自定义背景">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1.1.9-2 2-2h1.5A4.5 4.5 0 0 0 21 10c0-3.9-4-7-9-7Z"/><circle cx="7.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="7.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <div class="top-right">
        <button class="cycle-btn" id="cycleBtn" type="button" data-action="cycle">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
          <span id="cycleText">自然月</span>
        </button>

    </div>
    <div class="worker-bar">
      <div class="worker-switch" id="workerSwitch" role="tablist" aria-label="工种切换">
        <button type="button" role="tab" data-action="set-worker" data-w="regular" class="on" aria-selected="true">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5V3h6v1.5M8 12h8M8 16h5"/></svg>
          正式工
        </button>
        <button type="button" role="tab" data-action="set-worker" data-w="temp" aria-selected="false">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          临时工
        </button>
        <button type="button" role="tab" data-action="set-worker" data-w="piece" aria-selected="false">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.2 12 4l8.5 4.2v7.6L12 20l-8.5-4.2z"/><path d="M3.5 8.2 12 12.4l8.5-4.2M12 12.4V20"/></svg>
          计件
        </button>
        <button type="button" role="tab" data-action="set-worker" data-w="site" aria-selected="false">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.5v-3a8 8 0 0 1 16 0v3"/><path d="M2.5 18.5h19M9 7.2V4.4c0-.6.4-1 1-1h4c.6 0 1 .4 1 1v2.8"/></svg>
          工地
        </button>
      </div>
    </div>
  </header>
  <div class="warning" id="storageWarning" role="status" hidden></div>
  <main id="main" role="main"></main>
</div>

<nav class="nav" aria-label="应用导航">
  <button type="button" data-nav="calendar" data-action="view" data-view="calendar" class="on" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/><circle cx="8" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="17.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/></svg>
    日历
  </button>
  <button type="button" data-nav="details" data-action="view" data-view="details" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16M4 12h16M4 18.5h10"/><circle cx="19" cy="18.5" r="1.4" fill="currentColor" stroke="none"/></svg>
    明细
  </button>
  <button type="button" data-nav="settings" data-action="view" data-view="settings" aria-current="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    设置
  </button>
</nav>

<dialog id="editor" class="sheet" aria-label="记工"></dialog>
<dialog id="cycleDialog" class="sheet" aria-label="工资周期"></dialog>
<dialog id="aboutDialog" class="sheet" aria-label="关于工时记"></dialog>
<dialog id="bgDialog" class="sheet" aria-label="自定义背景"></dialog>

  <h2 id="confirmTitle">确认</h2>

    <button class="btn btn-ghost" type="button" data-action="cancel-confirm">取消</button>
    <button class="btn btn-primary" id="confirmYes" type="button">确定</button>
  </div>
</dialog>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="print-area" id="printArea"></div>
<script>
'use strict';
/* =====================================================================
   工时记 v1.0 · 完全离线 · 主程序（键盘模块见同目录 keypad.js）
   （源码分区：核心 / 节假日 / 算法 / 渲染 / 编辑器 / 键盘 / 设置 / 事件）
   ===================================================================== */

/* ==================== 基础工具 ==================== */
const $ = id => document.getElementById(id);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = k => new Date(k + 'T12:00:00');
const todayKey = () => ymd(new Date());
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const clamp = (n, a, b) => n < a ? a : n > b ? b : n;
const sum = arr => arr.reduce((a, b) => a + b, 0);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, def, min, max) => {
  const n = Number(v);
  if (!Number.isFinite(n)) return def;
  return clamp(n, min === undefined ? -Infinity : min, max === undefined ? Infinity : max);
};
const money = n => {
  const v = round2(Number(n) || 0);
  const neg = v < 0;
  const s = '¥' + Math.abs(v).toLocaleString('zh-CN', { minimumFractionDigits: Math.abs(v) % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (neg ? '-' : '') + s;
};
const moneyPlain = n => {
  const v = round2(Number(n) || 0);
  return Math.abs(v).toLocaleString('zh-CN', { minimumFractionDigits: Math.abs(v) % 1 ? 2 : 0, maximumFractionDigits: 2 });
};
const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
const MONTH_KEY = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);

/* ==================== 常量 ==================== */
const APP_VERSION = '1.0';
const STORE_V3 = 'gongshi_v3';
const STORE_V2 = 'gongshi_v2';
const STORE_THEME = 'gongshi_bg';

const WORKER_ORDER = ['regular', 'temp', 'piece', 'site'];
const WORKER_META = {
  regular: { name: '正式工', short: '正式工', accent: 'blue' },
  temp: { name: '临时工', short: '临时工', accent: 'orange' },
  piece: { name: '计件', short: '计件', accent: 'purple' },
  site: { name: '工地', short: '工地', accent: 'green' }
};
const WORK_SHIFTS = ['白班', '早班', '中班', '晚班', '夜班'];
const LEAVE_SHIFTS = ['休息', '事假', '病假'];
const ALL_SHIFTS = WORK_SHIFTS.concat(LEAVE_SHIFTS);
const SHIFT_CLASS = {
  白班: 'sh-white', 早班: 'sh-morning', 中班: 'sh-noon', 晚班: 'sh-evening', 夜班: 'sh-night',
  休息: 'sh-rest', 事假: 'sh-leave', 病假: 'sh-sick'
};
const TYPE_LABEL = { holiday: '法定节假日', weekend: '周末', workday: '工作日', off: '休息日', work: '上班日' };

/* 背景预设：id / 名称 / CSS 背景 */
const BG_PRESETS = [
  { id: 'default', name: '经典白', css: 'linear-gradient(180deg,#f7f9fc 0%,#eef3fa 100%)' },
  { id: 'sky', name: '晴空蓝', css: 'linear-gradient(180deg,#eaf3ff 0%,#f6faff 58%,#eef4ff 100%)' },
  { id: 'mint', name: '薄荷绿', css: 'linear-gradient(160deg,#e9f8f0 0%,#f5fbf8 55%,#e8f4ee 100%)' },
  { id: 'peach', name: '暖桃橙', css: 'linear-gradient(160deg,#fff1e8 0%,#fff8f3 55%,#ffeadf 100%)' },
  { id: 'lilac', name: '淡紫', css: 'linear-gradient(160deg,#f2edff 0%,#faf8ff 55%,#eee8ff 100%)' },
  { id: 'night', name: '深蓝夜', css: 'linear-gradient(160deg,#243b63 0%,#1a2a48 60%,#16233c 100%)' },
  { id: 'paper', name: '牛皮纸', css: 'linear-gradient(160deg,#f6f0e4 0%,#fbf7ef 60%,#f1e9d8 100%)' },
  { id: 'grad', name: '青蓝渐变', css: 'linear-gradient(150deg,#e6f2ff 0%,#f2fbff 40%,#e8f7f4 100%)' }
];

/* 工种默认记录/设置 */
function blankMonth() { return { deductions: [], allowances: [] }; }

const DEFAULT_WORKWEEK_ARR = [0, 1, 1, 1, 1, 1, 0]; // 日..六，1=上班

function defaultWorkerSettings(kind) {
  const common = {
    workWeek: DEFAULT_WORKWEEK_ARR.slice(), // 每个工种自己的工作周
    followHoliday: true,                    // 法定节假日按休处理
    followMakeup: true                      // 调休补班日按上班处理
  };
  if (kind === 'regular') {
    return Object.assign(common, {
      baseSalary: 0,               // 月薪
      daysPerMonth: 21.75,         // 每月计薪天数

function storageWarn() {
  const el = $('storageWarning');
  if (!el) return;
  if (storageOK) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = corruptRaw
    ? '本地数据读取异常，已暂停写入以保护原数据。请先用「导出备份」保留原文。'
    : '存储空间不可用，记录可能无法保存。请检查是否是隐私模式或空间已满。';
}

function rawGet(key) {
  try {
    if (window.AndroidBridge && typeof window.AndroidBridge.kvGet === 'function') {
      const v = window.AndroidBridge.kvGet(key);
      if (v) return v;
    }
  } catch (e) { }
  try { return localStorage.getItem(key); } catch (e) { }
  return null;
}

function rawSet(key, val) {
  let ok = false;
  try {
    if (window.AndroidBridge && typeof window.AndroidBridge.kvSet === 'function') {
      window.AndroidBridge.kvSet(key, val);
      ok = true;
    }
  } catch (e) { }
  try { localStorage.setItem(key, val); ok = true; } catch (e) { }
  return ok;
}

let persistTimer = 0;
function persist(now) {
  if (corruptRaw) { storageOK = false; storageWarn(); return false; }
  if (!now) {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(() => persist(true), 160);
    return true;
  }
  let json;
  try { json = JSON.stringify(state); } catch (e) { storageOK = false; storageWarn(); return false; }
  storageOK = rawSet(STORE_V3, json);
  try { rawSet(STORE_THEME, JSON.stringify(theme)); } catch (e) { }
  storageWarn();
  return storageOK;
}

/* 读入并清理 */
function cleanRecord(kind, v) {
  if (!v || typeof v !== 'object') return null;
  const note = String(v.note == null ? '' : v.note).slice(0, 200);
  if (kind === 'regular') {
    const shift = ALL_SHIFTS.includes(v.shift) ? v.shift : '白班';
    let otSplit = null;
    if (Array.isArray(v.otSplit)) {
      const arr = v.otSplit.slice(0, 3).map(x => num(x, 0, 0, 24));
      while (arr.length < 3) arr.push(0);
      if (arr.some(x => x > 0)) otSplit = arr;
    }
    let otHours = num(v.otHours, 0, 0, 24);
    // 有拆分时以拆分为准，避免总小时与分档对不上
    if (otSplit) otHours = round2(otSplit[0] + otSplit[1] + otSplit[2]);
    return {
      shift,
      otHours,
      otSplit,
      regularHours: (v.regularHours === null || v.regularHours === undefined) ? null : num(v.regularHours, 8, 0, 24),
      note
    };
  }
  if (kind === 'temp') {
    const shift = ALL_SHIFTS.includes(v.shift) ? v.shift : '白班';
    return {
      shift,
      hours: num(v.hours, 0, 0, 24),
      rate: num(v.rate, 0, 0, 1e6),
      note
    };
  }
  if (kind === 'piece') {
    const items = Array.isArray(v.items) ? v.items.slice(0, 20).map(it => ({
      name: String((it && it.name) || '').slice(0, 20),
      qty: num(it && it.qty, 0, 0, 1e6),
      rate: num(it && it.rate, 0, 0, 1e6)
    })).filter(it => it.qty > 0 || it.rate > 0 || it.name) : [];
    return { items, note };
  }
  // site
  const type = ['work', 'borrow', 'settle'].includes(v.type) ? v.type : 'work';
  const unit = ['day', 'hour', 'rest'].includes(v.unit) ? v.unit : 'day';
  return {
    type,
    unit,
    units: num(v.units, type === 'work' ? (unit === 'day' ? 1 : 0) : 0, 0, 30),
    hours: num(v.hours, 0, 0, 24),
    otHours: num(v.otHours, 0, 0, 24),
    dayRate: num(v.dayRate, 0, 0, 1e6),
    hourRate: num(v.hourRate, 0, 0, 1e6),
    otRate: num(v.otRate, 0, 0, 1e6),
    pkgQty: num(v.pkgQty, 0, 0, 1e6),
    pkgRate: num(v.pkgRate, 0, 0, 1e6),
    amount: num(v.amount, 0, 0, 1e7),
    note
  };
}

function cleanItems(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.filter(i => i && typeof i === 'object')
    .slice(0, 30)
    .map(i => ({ name: String(i.name == null ? '' : i.name).slice(0, 30), amount: num(i.amount, 0, 0, 1e7) }))
    .filter(i => i.name || i.amount);
}

function cleanSettings(kind, s) {
  const d = defaultWorkerSettings(kind);
  if (!s || typeof s !== 'object') return d;
  const wk = Array.isArray(s.workWeek) && s.workWeek.length === 7 ? s.workWeek.map(x => x ? 1 : 0) : d.workWeek.slice();
  const common = { workWeek: wk, followHoliday: s.followHoliday !== false, followMakeup: s.followMakeup !== false };
  if (kind === 'regular') {
    return Object.assign(common, {
      baseSalary: num(s.baseSalary, 0, 0, 1e8),
      daysPerMonth: num(s.daysPerMonth, 21.75, 1, 31),
      autoDays: s.autoDays !== false,
      hoursPerDay: num(s.hoursPerDay, 8, 0.5, 24),
      hourlyRate: (s.hourlyRate && Number(s.hourlyRate) > 0) ? num(s.hourlyRate, 0, 0, 1e8) : null,
      mulWeekday: num(s.mulWeekday, 1.5, 0, 10),
      mulWeekend: num(s.mulWeekend, 2, 0, 10),
      mulHoliday: num(s.mulHoliday, 3, 0, 10)
    });
  }
  if (kind === 'temp') {
    return Object.assign(common, {
      rate: num(s.rate, 0, 0, 1e6),
      rateOut: num(s.rateOut, 0, 0, 1e6),
      defaultHours: num(s.defaultHours, 8, 0, 24),
      defaultShift: WORK_SHIFTS.includes(s.defaultShift) ? s.defaultShift : '白班'
    });
  }
  if (kind === 'piece') {
    let items = Array.isArray(s.items) ? s.items.slice(0, 30).map(it => ({
      name: String((it && it.name) || '').slice(0, 20),
      rate: num(it && it.rate, 0, 0, 1e6)
    })) : [];
    if (!items.length) items = d.items;
    return Object.assign(common, { items, unit: String(s.unit || '件').slice(0, 6) || '件' });
  }
  return Object.assign(common, {
    dayRate: num(s.dayRate, 0, 0, 1e6),
    hourRate: num(s.hourRate, 0, 0, 1e6),
    otRate: num(s.otRate, 0, 0, 1e6),
    packageRate: num(s.packageRate, 0, 0, 1e6),
    dayRateOut: num(s.dayRateOut, 0, 0, 1e6),
    hourRateOut: num(s.hourRateOut, 0, 0, 1e6),
    otRateOut: num(s.otRateOut, 0, 0, 1e6),
    hoursPerDay: num(s.hoursPerDay, 8, 0.5, 24)
  });
}

function cleanData(raw) {
  const out = defaultState();
  const src = (raw && raw.data && typeof raw.data === 'object') ? raw.data : {};
  WORKER_ORDER.forEach(kind => {
    const w = src[kind] || {};
    out.data[kind].settings = cleanSettings(kind, w.settings);
    if (w.records && typeof w.records === 'object') {
      for (const [k, v] of Object.entries(w.records)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
        const rec = cleanRecord(kind, v);
        if (rec) out.data[kind].records[k] = rec;
      }
    }
    if (w.monthly && typeof w.monthly === 'object') {
      for (const [k, v] of Object.entries(w.monthly)) {
        if (!/^\d{4}-\d{2}$/.test(k) || !v || typeof v !== 'object') continue;
        out.data[kind].monthly[k] = {
          deductions: cleanItems(v.deductions),
          allowances: cleanItems(v.allowances),
          leaveHours: num(v.leaveHours, 0, 0, 744),
          leaveOrder: v.leaveOrder === 'high' ? 'high' : 'low'
        };
      }
    }
  });
  if (raw) {
    out.active = WORKER_ORDER.includes(raw.active) ? raw.active : 'regular';
    out.cycleStartDay = Math.round(num(raw.cycleStartDay, 1, 1, 28));
    out.settleNow = !!raw.settleNow;
    if (raw.overrides && typeof raw.overrides === 'object') {
      for (const [k, v] of Object.entries(raw.overrides)) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && (v === 'holiday' || v === 'workday')) out.overrides[k] = v;
      }
    }
    if (raw.timer && typeof raw.timer === 'object' && raw.timer.start) {
      out.timer = { start: num(raw.timer.start, Date.now()), paused: !!raw.timer.paused, acc: num(raw.timer.acc, 0, 0, 86400000) };
    }
  }
  return out;
}

/* 旧版（v2：单表 records + mode）迁移 */
function migrateFromV2(old) {
  const out = defaultState();
  const isTemp = old.mode === 'temp';
  out.active = isTemp ? 'temp' : 'regular';
  const r = old.regular || {};
  out.cycleStartDay = Math.round(num(r.cycleStartDay, 1, 1, 28));
  const reg = out.data.regular;
  reg.settings = cleanSettings('regular', {
    baseSalary: r.baseSalary, daysPerMonth: r.daysPerMonth, hoursPerDay: r.hoursPerDay,
    hourlyRate: r.hourlyRate, mulWeekday: r.mulWeekday, mulWeekend: r.mulWeekend, mulHoliday: r.mulHoliday,
    autoDays: false
  });
  out.data.temp.settings = cleanSettings('temp', { rate: (old.temp || {}).rate });
  if (old.records && typeof old.records === 'object') {
    for (const [k, v] of Object.entries(old.records)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !v) continue;
      const kind = v.worker === 'temp' ? 'temp' : 'regular';
      const rec = cleanRecord(kind, v);
      if (rec) out.data[kind].records[k] = rec;
    }
  }
  if (old.monthly && typeof old.monthly === 'object') {
    for (const [k, v] of Object.entries(old.monthly)) {
      if (!/^\d{4}-\d{2}$/.test(k) || !v) continue;
      const clean = {
        deductions: cleanItems(v.deductions),
        allowances: cleanItems(v.allowances),
        leaveHours: num(v.leaveHours, 0, 0, 744),
        leaveOrder: v.leaveOrder === 'high' ? 'high' : 'low'
      };
      out.data.regular.monthly[k] = JSON.parse(JSON.stringify(clean));
      out.data.temp.monthly[k] = JSON.parse(JSON.stringify(clean));
    }
  }
  if (old.overrides) {
    for (const [k, v] of Object.entries(old.overrides)) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && (v === 'holiday' || v === 'workday')) out.overrides[k] = v;
    }
  }
  return out;
}

      let oldRaw = rawGet(STORE_V2);
      if (!oldRaw) oldRaw = rawGet('gongshiji_data');

  } catch (e) { }
  storageWarn();
  if (migrated && !corruptRaw) persist(true);
  return state;
}

function lunarLeapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
function lunarLeapDays(y) {
  const lm = lunarLeapMonth(y);
  return lm ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0;
}
function lunarMonthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarYearDays(y) {
  let sum = 348;
  for (let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
  return sum + lunarLeapDays(y);
}

/** 公历转农历 */
function solarToLunar(y, m, d) {
  let offset = (Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000;
  let i, temp = 0;
  for (i = 1900; i < 2101 && offset > 0; i++) { temp = lunarYearDays(i); offset -= temp; }
  if (offset < 0) { offset += temp; i--; }
  const lYear = i, leap = lunarLeapMonth(lYear);
  let isLeap = false, lMonth = 1;
  for (i = 1; i < 13 && offset > 0; i++) {
    if (leap > 0 && i === leap + 1 && isLeap === false) {
      --i; isLeap = true; temp = lunarLeapDays(lYear);
    } else {
      temp = lunarMonthDays(lYear, i);
    }
    if (isLeap === true && i === leap + 1) isLeap = false;
    offset -= temp;
  }
  if (offset === 0 && leap > 0 && i === leap + 1) {
    if (isLeap) { isLeap = false; } else { isLeap = true; --i; }
  }
  if (offset < 0) { offset += temp; --i; }
  return { year: lYear, month: i, day: offset + 1, isLeap };
}

const LUNAR_MONTH_CN = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
const LUNAR_DAY_CN = ['', '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
  '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
  '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

const lunarCache = new Map();
/** 农历信息 { m: '正月', d: 1, isLeap: false, year, monthNum } */
function lunarOf(d) {
  const k = ymd(d);
  if (lunarCache.has(k)) return lunarCache.get(k);
  let out = null;
  try {
    const r = solarToLunar(d.getFullYear(), d.getMonth() + 1, d.getDate());
    if (r && r.month >= 1 && r.month <= 12) {
      out = { m: (r.isLeap ? '闰' : '') + LUNAR_MONTH_CN[r.month], d: r.day, isLeap: r.isLeap, year: r.year, monthNum: r.month };
    }
  } catch (e) { out = null; }
  lunarCache.set(k, out);
  return out;
}

const LUNAR_SUPPORT = true;

/** 农历小字：初一显示月名，其余显示日 */
function lunarText(k) {
  const l = lunarOf(parseD(k));
  if (!l) return '';
  if (l.d === 1) return l.m;
  return LUNAR_DAY_CN[l.d] || (l.d + '日');
}

/** 农历传统节日（不含法定节假日） */
function lunarFestival(k) {
  const l = lunarOf(parseD(k));
  if (!l || l.isLeap) return '';
  if (l.m === '腊月' && l.d === lunarMonthDays(l.year, 12)) return '除夕';
  const map = {
    '正月|1': '春节', '正月|15': '元宵节', '二月|2': '龙抬头',
    '五月|5': '端午节', '七月|7': '七夕', '七月|15': '中元节',
    '八月|15': '中秋节', '九月|9': '重阳节', '腊月|8': '腊八节', '腊月|23': '小年'
  };
  return map[l.m + '|' + l.d] || '';
}
