plugins {
    id 'com.android.application'
}

// 签名信息不写进仓库：从本机 local.properties（已 gitignore）读取。
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.dsha.gongshiji'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.deepseekharness.gongshiji"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(localProps.getProperty('gongshi.storeFile', '../gongshiji-release.jks'))
            storePassword localProps.getProperty('gongshi.storePassword', '')
            keyAlias localProps.getProperty('gongshi.keyAlias', 'gongshiji')
            keyPassword localProps.getProperty('gongshi.keyPassword', '')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
