plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsha.gongshiji'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.deepseekharness.gongshiji"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../gongshiji-release.jks")
            storePassword "***REDACTED***"
            keyAlias "gongshiji"
            keyPassword "***REDACTED***"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
